<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3b0710">
<title>Reset password — Keepsake</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap"><link rel="stylesheet" href="/assets/site.css">
<style>.reset-wrap{max-width:520px;margin:auto}.reset-panel{border:1px solid #6b3a35;border-radius:20px;padding:24px;background:#3a1218}.reset-panel label{display:block}.reset-panel input{width:100%;margin:6px 0 16px}.notice{margin-top:14px}.fine{font-size:14px;opacity:.8}.tools{display:flex;align-items:center;gap:8px;font-size:14px;margin:-5px 0 16px}.tools input{width:auto;margin:0}.reset-panel [hidden]{display:none!important}</style>
</head>
<body>
<header class="nav"><div class="wrap"><a class="brand" href="/">Keepsake</a><nav><a class="btn sm" href="/account">Customer login</a></nav></div></header>
<main><section class="hero"><div class="wrap reset-wrap"><div class="reset-panel">
<div class="eyebrow">Account security</div><h1>Reset your password</h1><p class="lead" id="intro">Choose a new password for your Keepsake account.</p>
<form id="resetForm">
<label for="password">New password (10–128 characters)</label><input id="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
<div class="tools"><input type="checkbox" id="showPassword"><label for="showPassword">Show password</label></div>
<label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
<button class="btn" id="submit" type="submit" style="width:100%">Reset password</button><p id="message" class="notice msg" role="status"></p>
</form><p><a href="/account">Back to customer login</a></p>
</div></div></section></main>
<footer><div class="wrap"><div><b class="brand" style="font-size:26px">Keepsake</b><br>NFC &amp; QR memory cards for people and businesses.</div><div><a href="/designs">Designs</a><a href="/business">For business</a><a href="/contact">Contact</a></div></div></footer>
<script>
const $=s=>document.querySelector(s);const params=new URLSearchParams(location.search);const token=params.get("token")||"";
if(!token){$("#intro").textContent="This reset link is missing or invalid. Request a new password reset from the login page.";}
$("#showPassword").onchange=()=>{$("#password").type=$("#showPassword").checked?"text":"password";$("#confirm").type=$("#showPassword").checked?"text":"password";};
$("#resetForm").onsubmit=async e=>{e.preventDefault();const msg=$("#message"),btn=$("#submit");msg.className="notice msg";if(!token){msg.textContent="This reset link is invalid. Please request a new one.";return;}if($("#password").value!==$("#confirm").value){msg.className="notice msg bad";msg.textContent="The passwords do not match.";return;}btn.disabled=true;msg.textContent="Updating your password…";
try{const r=await fetch("/api/customer-auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"reset-password",token,password:$("#password").value})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Could not reset password.");msg.className="notice msg ok";msg.textContent="Password reset successfully. You can now log in.";$("#resetForm").hidden=true;$("#intro").textContent="Your account password has been updated.";history.replaceState(null,"","/reset-password");}catch(err){msg.className="notice msg bad";msg.textContent=err.message;}finally{btn.disabled=false;}};
</script>
</body></html>
