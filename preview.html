<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1F1BF2">
<title>Your page preview · GetKeepsake</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800&display=swap">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
html,body{margin:0;background:#1f1611;min-height:100%}
.msg{min-height:100svh;display:grid;place-items:center;padding:30px;text-align:center;color:#fff;font:600 18px/1.5 Inter,system-ui,sans-serif;background:#1F1BF2}
.msg small{display:block;font-weight:500;opacity:.8;margin-top:8px}
.pvtop{position:sticky;top:0;z-index:70;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0B0B14;color:#fff;font:600 13.5px/1.35 Inter,system-ui,sans-serif}
.pvtop i{flex:none;width:8px;height:8px;border-radius:50%;background:#D4FF3F;box-shadow:0 0 0 4px rgba(212,255,63,.2)}
.pvbar{position:fixed;left:0;right:0;bottom:0;z-index:70;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#1F1BF2;color:#fff;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.pvbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.pvbar p{flex:1;margin:0;font:500 13px/1.35 Inter,system-ui,sans-serif;color:#E4E3FF}.pvbar p b{display:block;color:#fff;font:800 17px/1.2 'Inter Tight',Inter,sans-serif}
.pvbar a{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:999px;background:#D4FF3F;color:#0B0B14;font:800 15px 'Inter Tight',Inter,sans-serif;text-decoration:none}
body{padding-bottom:96px}
</style>
<script src="/assets/biz.v16.js"></script>
</head>
<body>
<main id="biz" aria-live="polite"><div class="msg">Loading your page…</div></main>
<script>
(async () => {
  const root = document.getElementById("biz");
  const say = (t, s) => { root.className = "msg"; root.innerHTML = ""; const d = document.createElement("div"); d.textContent = t; if (s) { const x = document.createElement("small"); x.textContent = s; d.appendChild(x); } root.appendChild(d); };
  const tok = (location.pathname.split("/")[2] || new URLSearchParams(location.search).get("t") || "").trim();
  if (!/^[a-z0-9]{10,16}$/.test(tok)) return say("This preview link isn't valid.");
  let j;
  try { const r = await fetch("/api/qr", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "pv-get", tok }), cache: "no-store" }); j = await r.json(); if (!r.ok) throw new Error(j.error || "This preview has expired."); }
  catch (e) { return say(e.message, "WhatsApp us on +91 83027 91217 for a new one."); }
  const D = Object.assign(KSBiz.blank(j.data.cat), j.data);
  root.className = ""; root.innerHTML = "";
  KSBiz.render(root, D, { preview: true });
  document.title = (D.t || "Your shop") + " · preview";
  const bg = getComputedStyle(root).getPropertyValue("--bg").trim(); if (bg) document.body.style.background = bg;
  const top = document.createElement("div"); top.className = "pvtop";
  top.innerHTML = "<i></i><span></span>"; top.querySelector("span").textContent = "Preview made for " + (D.t || "your shop") + ". Photos and prices are samples; you add your own.";
  document.body.prepend(top);
  const go = "/shops/studio?pv=" + encodeURIComponent(tok) + (j.sp ? "&sp=" + encodeURIComponent(j.sp) : "");
  const bar = document.createElement("div"); bar.className = "pvbar";
  bar.innerHTML = '<div class="in"><p><b></b>Your page, QR board and loyalty card. ₹1,000 once.</p><a>Make it mine</a></div>';
  bar.querySelector("b").textContent = D.t || "Your shop"; bar.querySelector("a").href = go;
  document.body.appendChild(bar);
})();
</script>
</body>
</html>
