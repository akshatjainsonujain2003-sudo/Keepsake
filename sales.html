<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Salesperson panel · GetKeepsake for Business</title>
<meta name="theme-color" content="#f4f1ea">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Pinyon+Script&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
:root{--bg:#f4f1ea;--pa:#fffdf8;--ink:#121110;--mu:#6c665d;--ln:#e2dccf;--ac:#ff5b2e;--ok:#1f8a4c;--fd:'Archivo Black','Arial Black',sans-serif;--fsc:'Pinyon Script',cursive;--fn:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fn);-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:18px 18px 60px}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:22px}
.top b{font:400 18px var(--fd)}.top span{font:400 22px var(--fsc);color:var(--ac)}
h1{margin:0;font:400 clamp(34px,10vw,52px)/.95 var(--fd);text-transform:uppercase;letter-spacing:-.02em}
h1 em{font:400 .9em var(--fsc);text-transform:none;color:var(--ac);letter-spacing:0}
.sub{color:var(--mu);margin:10px 0 22px}
.big{background:var(--ink);color:#fff;border-radius:26px;padding:24px;position:relative;overflow:hidden}
.big small{font:700 11px var(--fn);letter-spacing:.2em;text-transform:uppercase;color:#ffd84d}
.big .n{font:400 64px/1 var(--fd);margin:10px 0 4px}
.big .n span{font:500 20px var(--fn);color:#bdb6a8;margin-left:6px}
.bar{height:10px;border-radius:99px;background:#ffffff22;margin:14px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd84d,var(--ac));border-radius:99px}
.big p{margin:0;color:#cfc9bd;font-size:14px}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.money div{background:var(--pa);border:1px solid var(--ln);border-radius:20px;padding:14px}
.money small{display:block;font:600 11.5px var(--fn);color:var(--mu)}
.money b{display:block;font:400 22px var(--fd);margin-top:4px}
.money .ow{background:#ffd84d;border-color:transparent}
h2{font:400 22px var(--fd);text-transform:uppercase;margin:34px 0 12px}
.shop{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--pa);border:1px solid var(--ln);margin-bottom:8px;text-decoration:none;color:inherit}
.shop i{width:42px;height:42px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font:400 18px var(--fd);font-style:normal;flex:none}
.shop div{flex:1;min-width:0}.shop b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shop small{color:var(--mu)}
.shop span{font:700 13px var(--fn);color:var(--ac)}
.empty{padding:22px;border-radius:18px;border:1.5px dashed var(--ln);color:var(--mu);text-align:center}
.tools{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 18px;border-radius:999px;background:var(--ink);color:#fff;font:700 15px var(--fn);text-decoration:none;border:0;cursor:pointer}
.btn.wa{background:#25d366;color:#05301a}.btn.gh{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
details{background:var(--pa);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin-top:10px}
summary{cursor:pointer;font-weight:700}
.codes{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.codes span{font:600 12px ui-monospace,Menlo,monospace;padding:5px 8px;border-radius:8px;background:var(--bg)}
.codes span.u{background:#1f8a4c22;color:var(--ok);text-decoration:line-through}
.msg{padding:40px 10px;text-align:center;color:var(--mu)}
.foot{margin-top:34px;color:var(--mu);font-size:13px;text-align:center}
@media (max-width:420px){.money{grid-template-columns:1fr 1fr}.money .ow{grid-column:span 2}}
.login{background:var(--pa);border:1px solid var(--ln);border-radius:24px;padding:22px;display:grid;gap:12px;margin-top:8px}
.login label{display:grid;gap:6px;font:600 13px var(--fn)}
.login input{font:600 20px ui-monospace,Menlo,monospace;letter-spacing:.12em;padding:14px;border-radius:14px;border:1.5px solid var(--ln);background:#fff;text-transform:uppercase;width:100%}
.err{color:#b3362f;font-weight:600;min-height:1.3em;margin:0}
.code{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:16px 18px;border-radius:22px;background:#ffd84d}
.code small{display:block;font:700 11px var(--fn);letter-spacing:.18em;text-transform:uppercase}
.code b{font:400 30px var(--fd);letter-spacing:.06em}
.code button{border:0;border-radius:999px;padding:11px 16px;background:var(--ink);color:#fff;font:700 13px var(--fn);cursor:pointer}
.out{background:none;border:0;color:var(--mu);font:600 13px var(--fn);text-decoration:underline;cursor:pointer;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>GetKeepsake</b><span>for business</span></div>
  <div id="out"><p class="msg">Loading your sales…</p></div>
</div>
<script>
(() => {
const out = document.getElementById("out"), q = new URLSearchParams(location.search), KEY = "ks-sp";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rs = n => "₹" + (+n || 0).toLocaleString("en-IN");
const date = t => t ? new Date(t).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : "";
const saved = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } };
const tools = code => {
  const link = "https://getkeepsake.in/shops/studio?sp=" + code;
  const pitch = `Hi! I'd like to show you GetKeepsake for Business: a beautiful page for your shop with your menu, offers, Google reviews, Instagram, UPI and WhatsApp orders, all behind one QR on your counter. ₹499 one-time, no monthly fees.\n\nSee examples: https://getkeepsake.in/shops\nCreate your page (my code ${code} is already filled in): ${link}`;
  return `<h2>Sales tools</h2><div class="tools">
    <a class="btn" href="/assets/getkeepsake-business-sales-sheet.pdf" target="_blank" rel="noopener">Download sales sheet (PDF)</a>
    <a class="btn gh" href="/shops#examples" target="_blank" rel="noopener">Show live examples to a shop</a>
    <a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(pitch)}" target="_blank" rel="noopener">Send the pitch on WhatsApp</a></div>`;
};
function showLogin(msg) {
  out.innerHTML = `<h1>Salesperson <em>login</em></h1><p class="sub">Use the code and 6-digit PIN GetKeepsake gave you.</p>
    <form class="login" id="lf"><label>Your code<input id="lc" maxlength="12" autocomplete="username" placeholder="SPXXXX" required></label>
    <label>PIN<input id="lp" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••••" required></label>
    <p class="err" id="le">${esc(msg || "")}</p><button class="btn" type="submit">Log in</button></form>
    <p class="foot">Forgot your PIN? WhatsApp <a href="https://wa.me/916377547759">+91 63775 47759</a> and we'll send a new one.</p>`;
  const sv = saved(); if (sv && sv.code) document.getElementById("lc").value = sv.code;
  document.getElementById("lf").onsubmit = async e => {
    e.preventDefault(); const le = document.getElementById("le"); le.textContent = "Checking…";
    try {
      const r = await fetch("/api/qr", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "sp-login", code: document.getElementById("lc").value, pin: document.getElementById("lp").value }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error || "Couldn't log in.");
      try { localStorage.setItem(KEY, JSON.stringify({ code: j.code, tok: j.tok })); } catch (x) {}
      panel(j.code, j.tok);
    } catch (x) { le.textContent = x.message; }
  };
}
async function panel(code, tok) {
  out.innerHTML = '<p class="msg">Loading your sales…</p>';
  let j;
  try { const r = await fetch("/api/qr?spme=" + encodeURIComponent(code) + "&t=" + encodeURIComponent(tok), { cache: "no-store" }); j = await r.json(); if (!r.ok) throw new Error(j.error); }
  catch (e) { try { localStorage.removeItem(KEY); } catch (x) {} return showLogin(e.message || "Please log in again."); }
  const shops = j.shopsList || [];
  out.innerHTML = `<h1>Hi ${esc(j.name.split(" ")[0])},<br><em>keep going</em></h1>
    <p class="sub">Your shops and commission, updated live.</p>
    <div class="code"><div><small>Your salesperson code</small><b>${esc(j.code)}</b></div><button type="button" id="cp">Copy</button></div>
    <p style="margin:8px 4px 16px;color:var(--mu);font-size:14px">Ask every shop to type this code before paying ₹499. When their page goes live, ${j.comm ? `<b>${rs(j.comm)}</b> is added` : "your commission is added"} here.</p>
    <div class="big"><small>Shops activated</small><div class="n">${j.shops}<span>${j.shops === 1 ? "shop" : "shops"}</span></div><p>${j.comm ? `You earn ${rs(j.comm)} for every shop that goes live with your code` : "Commission rate will be set by GetKeepsake"}</p></div>
    <div class="money"><div><small>Earned</small><b>${rs(j.earned)}</b></div><div><small>Paid to you</small><b>${rs(j.paid)}</b></div><div class="ow"><small>Coming to you</small><b>${rs(j.owed)}</b></div></div>
    <h2>Your shops</h2>
    ${shops.length ? shops.map(s => `<a class="shop" href="${esc(s.url)}" target="_blank" rel="noopener"><i>${esc((s.name || "S").charAt(0).toUpperCase())}</i><div><b>${esc(s.name)}</b><small>Activated ${date(s.at)}${s.area ? " · " + esc(s.area) : ""}${j.comm ? " · +" + rs(j.comm) : ""}</small></div><span>View →</span></a>`).join("") : `<div class="empty">No shops yet. Your first one is one conversation away.</div>`}
    ${tools(j.code)}
    ${j.payouts.length ? `<details><summary>Payments received (${j.payouts.length})</summary>${j.payouts.slice().reverse().map(p => `<p style="margin:10px 0 0">${date(p.at)}: <b>${rs(p.amount)}</b> for ${p.shops} shop${p.shops > 1 ? "s" : ""}</p>`).join("")}</details>` : ""}
    <p class="foot">Questions about your commission? WhatsApp <a href="https://wa.me/916377547759">+91 63775 47759</a>.</p>
    <div style="text-align:center"><button class="out" id="lo">Log out</button></div>`;
  document.getElementById("cp").onclick = async e => { try { await navigator.clipboard.writeText(j.code); e.target.textContent = "Copied ✓"; } catch (x) {} };
  document.getElementById("lo").onclick = () => { try { localStorage.removeItem(KEY); } catch (x) {} showLogin(); };
}
// Older per-batch links (?b=…&k=…) still work
async function legacy() {
  let j;
  try { const r = await fetch("/api/qr?sales=" + encodeURIComponent(q.get("b")) + "&key=" + encodeURIComponent(q.get("k") || ""), { cache: "no-store" }); j = await r.json(); if (!r.ok) throw new Error(j.error); }
  catch (e) { return showLogin(); }
  out.innerHTML = `<h1>${esc(j.name)}</h1><div class="big"><small>Shops activated</small><div class="n">${j.activated}<span>of ${j.count} cards</span></div></div>
    <h2>Shops</h2>${j.shops.map(s => `<a class="shop" href="${esc(s.url)}"><i>${esc(s.name.charAt(0))}</i><div><b>${esc(s.name)}</b><small>${date(s.at)}</small></div></a>`).join("") || '<div class="empty">No shops yet.</div>'}
    <p class="foot"><a href="/sales">Log in with your salesperson code</a></p>`;
}
if (q.get("b")) legacy();
else { const sv = saved(); if (sv && sv.code && sv.tok) panel(sv.code, sv.tok); else showLogin(); }
})();
</script>
</body>
</html>
