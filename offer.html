<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7ef">
<meta name="robots" content="noindex">
<title>Your offer · GetKeepsake</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<style>
:root{--bg:#fff7ef;--tx:#1b1410;--mu:#6d625a;--ln:#ead9c8;--ac:#ff5b2e;--on:#fff;--ok:#0f9d58;--bad:#c0392b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:22px 18px calc(30px + env(safe-area-inset-bottom));min-height:100svh;display:flex;flex-direction:column}
.shop{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.shop img,.shop .lg{width:48px;height:48px;border-radius:14px;object-fit:cover;flex:none;background:var(--ac);color:var(--on);display:grid;place-items:center;font:800 20px Fraunces,Georgia,serif}
.shop b{display:block;font:800 18px/1.2 Inter,system-ui,sans-serif}
.shop small{color:var(--mu);font-size:13.5px}
.card{position:relative;border-radius:26px;background:var(--ac);color:var(--on);padding:26px 22px 22px;overflow:hidden}
.card:after{content:"";position:absolute;left:-30px;right:-30px;bottom:64px;border-top:2px dashed color-mix(in srgb,var(--on) 45%,transparent)}
.card .k{font:700 12px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.card h1{margin:10px 0 8px;font:800 clamp(30px,9vw,40px)/1.05 Fraunces,Georgia,serif;letter-spacing:-.01em}
.card p{margin:0 0 30px;opacity:.92;font-size:15px}
.card .v{position:relative;margin-top:34px;font:600 13.5px Inter,sans-serif;opacity:.9}
form{margin-top:22px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:12px}
input[type=tel],input[type=text]{display:block;width:100%;margin-top:6px;padding:15px 16px;border-radius:14px;border:1.5px solid var(--ln);background:#fff;color:inherit;font:700 18px Inter,sans-serif;letter-spacing:.04em}
input:focus{outline:2px solid var(--tx);outline-offset:1px}
.cb{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:13.5px;color:var(--mu)}
.cb input{width:19px;height:19px;margin:2px 0 0;flex:none;accent-color:var(--tx)}
.btn{display:block;width:100%;padding:17px;border:0;border-radius:999px;background:var(--tx);color:#fff;font:800 17px Inter,sans-serif;cursor:pointer;text-align:center;text-decoration:none}
.btn:disabled{opacity:.55}
.btn.l{background:none;color:var(--tx);border:1.5px solid var(--ln)}
.err{min-height:22px;margin:10px 0 0;color:var(--bad);font-weight:600;font-size:14px}
.tk{margin-top:22px;border-radius:22px;background:#fff;border:1.5px solid var(--ln);padding:20px;text-align:center}
.tk .c{display:block;margin:8px 0 6px;padding:14px;border-radius:16px;border:2px dashed var(--tx);font:800 30px ui-monospace,Menlo,monospace;letter-spacing:.1em}
.tk small{color:var(--mu);font-size:13px}
.how{margin:18px 0 0;padding:0;list-style:none;counter-reset:s}
.how li{position:relative;padding:0 0 12px 38px;font-size:14.5px}
.how li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;background:var(--tx);color:#fff;display:grid;place-items:center;font:800 13px Inter,sans-serif}
.ask{margin-top:18px;padding:16px;border-radius:18px;background:#fff;border:1.5px solid var(--ln)}
.ask b{display:block;margin-bottom:10px}
.ask .r{display:flex;gap:10px}.ask .r button{flex:1;padding:12px;border-radius:999px;border:1.5px solid var(--tx);background:none;font:700 15px Inter,sans-serif;cursor:pointer;color:var(--tx)}
.ask .r button.y{background:var(--tx);color:#fff}
.list{display:grid;gap:12px;margin-top:6px}
.it{border-radius:20px;background:#fff;border:1.5px solid var(--ln);padding:16px}
.it b{display:block;font:800 19px/1.25 Fraunces,Georgia,serif;margin-bottom:2px}
.it small{display:block;color:var(--mu);font-size:13px;margin-bottom:12px}
.it.used{opacity:.6}
h2{font:800 24px/1.2 Fraunces,Georgia,serif;margin:0 0 6px}
.mu{color:var(--mu);font-size:14.5px;margin:0 0 16px}
.or{display:flex;align-items:center;gap:10px;margin:24px 0 14px;color:var(--mu);font-size:13px}.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--ln)}
.foot{margin-top:auto;padding-top:26px;text-align:center;font-size:12px;color:var(--mu)}.foot a{color:inherit}
.msg{margin:auto 0;text-align:center}.msg h2{margin-bottom:8px}
/* The live ticket: animated so a screenshot is easy to spot */
.live{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px calc(28px + env(safe-area-inset-bottom));color:#fff;text-align:center;overflow:hidden;
  background:repeating-linear-gradient(135deg,#0c8a4c 0 34px,#0f9d58 34px 68px);background-size:192px 192px;animation:slide 1.6s linear infinite}
@keyframes slide{to{background-position:192px 0}}
.live .ring{position:relative;width:132px;height:132px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 0 #fff8;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{to{box-shadow:0 0 0 34px #fff0}}
.live svg{width:76px;height:76px}
.live svg path{fill:none;stroke:#0f9d58;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .55s .15s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.live .vl{margin:26px 0 2px;font:800 52px/1 Inter,sans-serif;letter-spacing:.06em}
.live .clk{font:800 clamp(30px,10vw,44px)/1.1 ui-monospace,Menlo,monospace;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.live .dt{font:600 15px Inter,sans-serif;opacity:.9;margin-bottom:22px}
.live .of{max-width:380px;padding:16px 18px;border-radius:20px;background:#fff;color:#0b3d24}
.live .of b{display:block;font:800 22px/1.2 Fraunces,Georgia,serif}
.live .of span{display:block;margin-top:6px;font:800 18px ui-monospace,Menlo,monospace;letter-spacing:.08em}
.live .of small{display:block;margin-top:4px;font-size:13px;opacity:.75}
.live .note{margin-top:18px;font-size:13.5px;opacity:.92;max-width:340px}
.live .x{margin-top:18px;border:0;background:#fff3;color:#fff;padding:11px 22px;border-radius:999px;font:700 14px Inter,sans-serif;cursor:pointer}
.live.old{background:#5b6168;animation:none}.live.old .ring{animation:none}.live.old svg path{stroke:#5b6168}
@media (prefers-reduced-motion:reduce){.live svg path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<main id="app" aria-live="polite"><div class="msg"><p class="mu">Loading…</p></div></main>
<script>
(() => {
  const app = document.getElementById("app");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const post = async (a, b) => { const r = await fetch("/api/campaign/" + a, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }); const j = await r.json().catch(() => ({})); if (!r.ok) { const e = new Error(j.error || "Something went wrong. Please try again."); e.j = j; throw e; } return j; };
  // Claims live on this phone (a token per claim). Nothing else about the customer is kept here.
  const KEY = "ks-claims";
  const mine = () => { try { const a = JSON.parse(localStorage.getItem(KEY) || "[]"); return Array.isArray(a) ? a.filter(x => x && /^[a-f0-9]{24}$/.test(x.token)) : []; } catch (e) { return []; } };
  const keep = c => { try { const a = mine().filter(x => x.token !== c.token); a.unshift({ token: c.token, cid: c.cid, page: c.page, at: c.at }); localStorage.setItem(KEY, JSON.stringify(a.slice(0, 40))); } catch (e) {} };
  const day = d => d ? new Date(d + "T12:00:00+05:30").toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : "";
  const when = t => new Date(t).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  const say = (h, p, more) => { app.innerHTML = `<div class="msg"><h2>${esc(h)}</h2><p class="mu">${esc(p || "")}</p>${more || ""}</div>` + foot(); };
  const foot = () => `<div class="foot">Offers by <a href="/shops">GetKeepsake</a> · <a href="/privacy">Privacy</a></div>`;
  const brand = s => { if (s && s.ac) { document.documentElement.style.setProperty("--ac", s.ac); } };
  const head = s => `<div class="shop">${s.logo ? `<img src="${esc(s.logo)}" alt="">` : `<span class="lg">${esc((s.name || "S")[0])}</span>`}<div><b>${esc(s.name)}</b>${s.area ? `<small>${esc(s.area)}</small>` : ""}</div></div>`;

  const om = location.pathname.match(/^\/o\/([a-z0-9]{10})\/?$/), rm = location.pathname.match(/^\/r\/([a-z0-9]{8,16})\/?$/i);
  if (om) offer(om[1]); else if (rm) counter(rm[1]); else say("This offer wasn't found.", "Check the QR code and try again.");

  // ---------- /o/<campaign>?p=<placement>: claim the offer ----------
  async function offer(cid) {
    const p = Math.max(0, parseInt(new URLSearchParams(location.search).get("p"), 10) || 0);
    const had = mine().find(x => x.cid === cid);
    let j;
    try { j = await post("view", { cid, p, count: !had, token: had ? had.token : "" }); } catch (e) { return say("This offer wasn't found.", e.message); }
    brand(j.shop); document.title = j.offer.title + " · " + j.shop.name;
    if (j.mine) return claimed(j, j.mine);
    if (!j.open) return say(j.why, "Follow " + j.shop.name + " for the next offer.", j.shop.id ? `<a class="btn l" href="/b/${esc(j.shop.id)}">See ${esc(j.shop.name)}</a>` : "");
    app.innerHTML = head(j.shop) + ticket(j.offer) + `
      <form novalidate><label>Your mobile number<input type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="14" placeholder="10-digit mobile" required></label>
      <label class="cb"><input type="checkbox" checked> <span>${esc(j.shop.name)} can send me offers on WhatsApp or SMS. I can stop them any time.</span></label>
      <button class="btn" type="submit">Get this offer</button><div class="err" role="alert"></div></form>
      <ul class="how"><li>Get your code here, free.</li><li>Visit ${esc(j.shop.name)} before ${esc(day(j.offer.end))}.</li><li>Scan the <b>Redeem here</b> QR at the counter.</li></ul>` + foot();
    const f = app.querySelector("form"), tel = f.querySelector("input[type=tel]"), err = f.querySelector(".err"), btn = f.querySelector(".btn");
    f.onsubmit = async e => {
      e.preventDefault(); err.textContent = "";
      const ph = tel.value.replace(/\D/g, "").replace(/^(91|0)(?=\d{10}$)/, "");
      if (!/^[6-9]\d{9}$/.test(ph)) { err.textContent = "Enter a valid 10-digit mobile number."; tel.focus(); return; }
      if (!f.querySelector(".cb input").checked) { err.textContent = "Tick the box to get your offer."; return; }
      btn.disabled = true; btn.textContent = "Getting your code…";
      try { const r = await post("claim", { cid, p, phone: ph, consent: true }); keep(r.claim); claimed(j, r.claim, true); }
      catch (x) { err.textContent = x.message; btn.disabled = false; btn.textContent = "Get this offer"; }
    };
  }
  const ticket = o => `<div class="card"><div class="k">Offer</div><h1>${esc(o.title)}</h1><p>${esc(o.details || "Show your code at the shop.")}</p><div class="v">Valid ${o.start && o.start > new Date(Date.now() + 5.5 * 36e5).toISOString().slice(0, 10) ? "from " + esc(day(o.start)) + " " : ""}till ${esc(day(o.end))}</div></div>`;
  function claimed(j, c, fresh) {
    keep(c);
    const used = !!c.red, late = Date.now() - c.at > 6 * 3600e3;
    app.innerHTML = head(j.shop) + ticket(j.offer) +
      `<div class="tk">${used ? `<b>Used on ${esc(when(c.red))}</b><br><small>Thanks for visiting ${esc(j.shop.name)}!</small>` :
        `<small>${fresh ? "Done! Your code:" : "You already have this offer. Your code:"}</small><span class="c">${esc(c.code)}</span><small>Kept on this phone. Take a screenshot too.</small>`}</div>` +
      (used ? "" : `<ul class="how"><li>Visit ${esc(j.shop.name)} before ${esc(day(j.offer.end))}.</li><li>At the counter, scan the <b>Redeem here</b> QR with this phone.</li><li>Show the green ticket. Done!</li></ul>`) +
      (!used && late && !c.visit ? `<div class="ask"><b>Did you visit ${esc(j.shop.name)}?</b><div class="r"><button class="y" data-a="yes">Yes</button><button data-a="no">Not yet</button></div></div>` : "") +
      (j.shop.id ? `<a class="btn l" style="margin-top:18px" href="/b/${esc(j.shop.id)}">See ${esc(j.shop.name)}</a>` : "") + foot();
    const ask = app.querySelector(".ask");
    if (ask) ask.onclick = async e => {
      const a = e.target.closest("button"); if (!a) return;
      try { await post("visit", { token: c.token, answer: a.dataset.a }); } catch (x) {}
      ask.innerHTML = a.dataset.a === "yes" ? `<b>Thanks!</b><span class="mu">Next time, scan the <b>Redeem here</b> QR at the counter to use your offer. If the shop didn't let you, tell us on <a href="https://wa.me/918302791217">WhatsApp</a>.</span>` : `<b>No problem.</b><span class="mu">Your offer is valid till ${esc(day(j.offer.end))}.</span>`;
    };
  }

  // ---------- /r/<page>: the counter QR at the shop ----------
  async function counter(page) {
    const toks = mine().filter(x => x.page === page).map(x => x.token);
    let j;
    try { j = await post("counter", { page, tokens: toks }); } catch (e) { return say("This shop wasn't found.", e.message); }
    brand(j.shop); document.title = "Redeem · " + j.shop.name;
    const open = j.claims.filter(c => !c.red), used = j.claims.filter(c => c.red);
    app.innerHTML = head(j.shop) + `<h2>Redeem your offer</h2>` +
      (open.length ? `<p class="mu">Tap below with the staff watching. Each offer works once.</p><div class="list">${open.map(c => `<div class="it"><b>${esc(c.title)}</b><small>Code ${esc(c.code)} · valid till ${esc(day(c.end))}</small><button class="btn" data-t="${esc(c.token)}">Use it now</button></div>`).join("")}</div>`
        : `<p class="mu">No offers from ${esc(j.shop.name)} on this phone yet.</p>`) +
      `<div class="or">Got your code another way?</div><form novalidate><label>Your code<input type="text" autocapitalize="characters" autocomplete="off" maxlength="12" placeholder="e.g. DIW-7K2Q"></label><button class="btn l" type="submit">Use this code</button><div class="err" role="alert"></div></form>` +
      (used.length ? `<div class="or">Used</div><div class="list">${used.map(c => `<div class="it used"><b>${esc(c.title)}</b><small>Used on ${esc(when(c.red))}</small></div>`).join("")}</div>` : "") +
      `<a class="btn l" style="margin-top:22px" href="/b/${esc(page)}">See ${esc(j.shop.name)}</a>` + foot();
    const err = app.querySelector(".err");
    const go = async (body, btn) => {
      if (!confirm("Use this offer now? Show the next screen to the staff. It works only once.")) return;
      err.textContent = ""; if (btn) { btn.disabled = true; btn.textContent = "Checking…"; }
      try { const r = await post("redeem", { page, ...body }); live(r.claim, j.shop, r.already, () => counter(page)); }
      catch (x) { err.textContent = x.message; if (btn) { btn.disabled = false; btn.textContent = btn.dataset.t ? "Use it now" : "Use this code"; } if (btn && btn.dataset.t) btn.insertAdjacentHTML("afterend", `<div class="err">${esc(x.message)}</div>`); }
    };
    app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => go({ token: b.dataset.t }, b));
    const f = app.querySelector("form"), inp = f.querySelector("input");
    f.onsubmit = e => { e.preventDefault(); const code = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); if (code.length < 7) { err.textContent = "Enter the code from your offer, like DIW-7K2Q."; return; } go({ code: code.slice(0, 3) + "-" + code.slice(3) }, f.querySelector(".btn")); };
  }
  // Green and moving with a live clock: a screenshot of it freezes, so staff can tell.
  function live(c, shop, already, back) {
    // Already used: grey, unless it was used on this very phone a few minutes ago (they reopened the page).
    const fresh = !already || (!!c.token && mine().some(x => x.token === c.token) && Date.now() - c.red < 10 * 60e3);
    const d = document.createElement("div"); d.className = "live" + (fresh ? "" : " old"); d.setAttribute("role", "dialog"); d.setAttribute("aria-label", fresh ? "Offer valid" : "Offer already used");
    d.innerHTML = `<div class="ring"><svg viewBox="0 0 80 80" aria-hidden="true">${fresh ? '<path d="M20 42 L35 56 L61 26"/>' : '<path d="M24 24 L56 56 M56 24 L24 56"/>'}</svg></div>
      <div class="vl">${fresh ? "VALID" : "USED"}</div><div class="clk">--:--:--</div><div class="dt"></div>
      <div class="of"><b>${esc(c.title)}</b><span>${esc(c.code)}</span><small>${esc(shop.name)} · redeemed ${esc(when(c.red))}</small></div>
      <div class="note">${fresh ? "Staff: the stripes move and the clock ticks. A screenshot won't." : "This offer was already used. Each offer works once."}</div><button class="x" type="button">Done</button>`;
    document.body.appendChild(d);
    const clk = d.querySelector(".clk"), dt = d.querySelector(".dt");
    const tick = () => { const n = new Date(); clk.textContent = n.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true }); dt.textContent = n.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" }); };
    tick(); const iv = setInterval(tick, 1000);
    try { navigator.vibrate && navigator.vibrate(fresh ? [60, 40, 60] : 200); } catch (e) {}
    d.querySelector(".x").onclick = () => { clearInterval(iv); d.remove(); back(); };
  }
})();
</script>
</body>
</html>
