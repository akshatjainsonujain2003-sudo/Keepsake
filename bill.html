<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bill · GetKeepsake</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F2F2EE">
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<script src="/assets/gst.v1.js" defer></script>
<style>
:root{--bg:#F2F2EE;--card:#fff;--ink:#0B0B14;--mu:#5B5B69;--line:#DADAD3;--bl:#1F1BF2;--li:#D4FF3F;--gr:#14733f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 120px}
.inv{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;overflow:hidden}
.hd{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.sel{display:flex;gap:14px;min-width:0;flex:1 1 300px}
.lg{flex:none;width:56px;height:56px;border-radius:14px;background:var(--ink) center/cover no-repeat;color:#fff;display:grid;place-items:center;font:800 22px 'Inter Tight',sans-serif}
.sel h1{margin:0;font:800 22px/1.1 'Inter Tight',sans-serif;letter-spacing:-.03em}
.sel p{margin:4px 0 0;color:var(--mu);font-size:13px}
.kind{text-align:right;flex:0 1 240px}
.kind b{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--ink);color:#fff;font:600 11px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
.kind dl{margin:12px 0 0;display:grid;grid-template-columns:auto auto;justify-content:end;gap:3px 12px;font-size:13px}
.kind dt{color:var(--mu)}.kind dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.to{display:grid;grid-template-columns:1fr auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.lb{font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.to b{display:block;margin-top:6px;font-size:15px}.to p{margin:2px 0 0;color:var(--mu);font-size:13px}
.st{align-self:start;padding:8px 14px;border-radius:999px;font:700 12px Inter;white-space:nowrap}
.st.paid{background:#d9f5e3;color:var(--gr)}.st.due{background:#fff0d6;color:#8a5300}.st.cx{background:#fde2e2;color:#a11d1d}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.items{margin-top:8px}
.items th{text-align:right;font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);padding:12px 6px;border-bottom:1px solid var(--line)}
.items td{text-align:right;padding:12px 6px;border-bottom:1px solid #ecece6;vertical-align:top}
.items th:nth-child(-n+2),.items td:nth-child(-n+2){text-align:left}
.items td small{display:block;color:var(--mu);font-size:12px}
.sum{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;margin-top:20px}
.rt th,.rt td{padding:6px 4px;text-align:right;font-size:12.5px;border-bottom:1px solid #ecece6}
.rt th{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--mu);text-transform:uppercase}
.rt th:first-child,.rt td:first-child{text-align:left}
.tot div{display:flex;justify-content:space-between;padding:5px 0;font-variant-numeric:tabular-nums}
.tot div span:first-child{color:var(--mu)}
.tot .g{margin-top:8px;padding:14px 16px;border-radius:14px;background:var(--ink);color:#fff;font:800 22px 'Inter Tight',sans-serif;letter-spacing:-.02em}
.tot .g span:first-child{color:#B4B4C2;font:600 13px Inter;align-self:center;letter-spacing:0}
.words{margin-top:10px;font-size:12.5px;color:var(--mu)}
.ft{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mu)}
.ft p{margin:0 0 4px}
.upi{display:flex;gap:14px;align-items:center}
.upi .q{width:104px;height:104px;padding:6px;border:1px solid var(--line);border-radius:12px;background:#fff}
.upi .q svg{width:100%;height:100%;display:block}
.made{margin-top:18px;text-align:center;font-size:11.5px;color:var(--mu)}.made a{color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar div{max-width:820px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:999px;border:0;background:var(--ink);color:#fff;font:700 14px Inter;text-decoration:none;cursor:pointer}
.btn.pay{background:var(--bl)}.btn.g{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.msg{padding:60px 20px;text-align:center;color:var(--mu)}.msg b{display:block;color:var(--ink);font:800 22px 'Inter Tight',sans-serif;margin-bottom:6px}
@media (max-width:640px){
  .inv{padding:20px 16px;border-radius:18px}
  .kind{text-align:left;flex-basis:100%}.kind dl{justify-content:start}
  .sum{grid-template-columns:1fr}
  .items thead{display:none}
  .items tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid #ecece6}
  .items td{padding:0;border:0;text-align:left}
  .items td.n{grid-column:1}.items td.a{grid-column:2;grid-row:1;text-align:right;font-weight:700}
  .items td.x{grid-column:1/-1;color:var(--mu);font-size:12.5px}
  .items td.h{display:none}
}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff}.wrap{max-width:none;padding:0}.inv{border:0;padding:0;border-radius:0}
  .bar,.made{display:none}.tot .g{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}.tot .g span:first-child{color:var(--mu)}
  .items thead{display:table-header-group}
}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="msg">Loading bill…</div></main>
<div class="bar" id="bar" hidden><div id="barIn"></div></div>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rs = n => "₹" + (+n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const r0 = n => "₹" + Math.round(+n || 0).toLocaleString("en-IN");
const qn = n => (+n).toLocaleString("en-IN", { maximumFractionDigits: 3 });
const t = (location.pathname.split("/")[2] || new URLSearchParams(location.search).get("t") || "").trim();
const STATES = () => (window.KSGST && KSGST.STATES) || {};
const stName = c => (STATES()[c] ? STATES()[c] + " (" + c + ")" : c || "");

function render(b) {
  const s = b.seller || {}, c = b.cust || {}, k = b.calc || {}, tax = b.kind === "tax";
  const date = new Date(b.at).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
  document.title = (tax ? "Tax invoice " : "Bill ") + b.no + " · " + (s.name || "GetKeepsake");
  const st = b.cancel ? `<span class="st cx">Cancelled</span>` : b.paid ? `<span class="st paid">Paid</span>` : `<span class="st due">Payment due</span>`;
  const showDisc = (k.lines || []).some(x => x.dp > 0);
  const rows = (k.lines || []).map((x, i) => `<tr>
    <td class="h">${i + 1}</td>
    <td class="n"><b>${esc(x.n)}</b>${x.hsn ? `<small>HSN/SAC ${esc(x.hsn)}</small>` : ""}</td>
    <td class="x">${qn(x.q)} × ${rs(x.p)}${x.dp ? ` · ${x.dp}% off` : ""}${tax ? ` · GST ${x.r}%` : ""}</td>
    <td class="a">${rs(x.net != null ? x.net : x.amt)}</td></tr>`).join("");
  const rateRows = tax ? (k.rates || []).filter(r => r.r > 0 || k.rates.length > 1).map(r => `<tr><td>${r.r}%</td><td>${rs(r.tv)}</td>${k.intra ? `<td>${rs(r.c)}</td><td>${rs(r.s)}</td>` : `<td>${rs(r.i)}</td>`}</tr>`).join("") : "";
  const upi = s.upi && !b.paid && !b.cancel ? `upi://pay?pa=${encodeURIComponent(s.upi.id)}&pn=${encodeURIComponent(s.upi.name || s.name || "")}&am=${k.total}&cu=INR&tn=${encodeURIComponent("Bill " + b.no)}` : "";
  $("#app").innerHTML = `<article class="inv">
    <header class="hd">
      <div class="sel"><span class="lg" style="${s.logo ? `background-image:url('${esc(s.logo)}')` : ""}">${s.logo ? "" : esc((s.name || "?").charAt(0))}</span>
        <div style="min-width:0"><h1>${esc(s.name)}</h1>
          ${s.legal && s.legal !== s.name ? `<p>${esc(s.legal)}</p>` : ""}
          ${s.addr ? `<p>${esc(s.addr)}</p>` : ""}
          <p>${s.gstin ? `GSTIN <b style="color:var(--ink)">${esc(s.gstin)}</b> · ` : ""}${s.phone ? "+91 " + esc(s.phone) : ""}</p></div></div>
      <div class="kind"><b>${tax ? "Tax invoice" : "Bill of supply"}</b>
        <dl><dt>Invoice no.</dt><dd>${esc(b.no)}</dd><dt>Date</dt><dd>${date}</dd>${tax ? `<dt>Place of supply</dt><dd>${esc(stName(k.pos))}</dd>` : ""}</dl></div>
    </header>
    <section class="to"><div><span class="lb">Billed to</span><b>${esc(c.name || "Walk-in customer")}</b>
      ${c.phone ? `<p>+91 ${esc(c.phone)}</p>` : ""}${c.gstin ? `<p>GSTIN ${esc(c.gstin)}</p>` : ""}${c.addr ? `<p>${esc(c.addr)}</p>` : ""}</div>${st}</section>
    <table class="items"><thead><tr><th>#</th><th>Item</th><th>Qty × rate${showDisc ? " · off" : ""}${tax ? " · GST" : ""}</th><th>${tax && !b.inc ? "Taxable" : "Amount"}</th></tr></thead><tbody>${rows}</tbody></table>
    <section class="sum">
      <div>${tax && rateRows ? `<span class="lb">Tax summary</span><table class="rt" style="margin-top:8px"><thead><tr><th>GST</th><th>Taxable</th>${k.intra ? "<th>CGST</th><th>SGST</th>" : "<th>IGST</th>"}</tr></thead><tbody>${rateRows}</tbody></table>` : ""}
        ${b.inc && tax ? `<p class="words">Prices include GST.</p>` : ""}${!tax ? `<p class="words">Not a tax invoice. No GST is charged on this bill.</p>` : ""}</div>
      <div class="tot">
        ${tax ? `<div><span>Taxable value</span><span>${rs(k.taxable)}</span></div>${k.intra ? `<div><span>CGST</span><span>${rs(k.cgst)}</span></div><div><span>SGST</span><span>${rs(k.sgst)}</span></div>` : `<div><span>IGST</span><span>${rs(k.igst)}</span></div>`}` : `<div><span>Subtotal</span><span>${rs(k.taxable)}</span></div>`}
        ${k.roff ? `<div><span>Round off</span><span>${k.roff > 0 ? "+" : "−"}${rs(Math.abs(k.roff)).slice(1)}</span></div>` : ""}
        <div class="g"><span>Total</span><span>${r0(k.total)}</span></div>
        <p class="words">${esc(k.words)}</p>
      </div>
    </section>
    <footer class="ft">
      <div style="flex:1 1 280px">${b.note ? `<p><b style="color:var(--ink)">Note:</b> ${esc(b.note)}</p>` : ""}${b.terms ? `<p>${esc(b.terms)}</p>` : ""}<p>This is a computer-generated ${tax ? "invoice" : "bill"} and needs no signature.</p></div>
      ${upi ? `<div class="upi"><div class="q" id="uq" aria-label="UPI QR code to pay ${r0(k.total)}"></div><div><span class="lb">Scan to pay</span><p style="margin:4px 0 0;color:var(--ink);font-weight:700">${r0(k.total)}</p><p style="margin:0">${esc(s.upi.id)}</p></div></div>` : ""}
    </footer>
  </article>
  <p class="made">Bill made with <a href="/">GetKeepsake</a></p>`;
  if (upi) (function draw() { if (!window.qrcode) return setTimeout(draw, 200); const q = qrcode(0, "M"); q.addData(upi); q.make(); $("#uq").innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); })();
  const wa = s.phone ? `https://wa.me/91${s.phone}?text=${encodeURIComponent("Hi, about bill " + b.no)}` : "";
  $("#barIn").innerHTML = `${upi ? `<a class="btn pay" href="${esc(upi)}">Pay ${r0(k.total)} by UPI</a>` : ""}<button type="button" class="btn ${upi ? "g" : ""}" id="pdf">Save PDF</button>${wa ? `<a class="btn g" href="${esc(wa)}" target="_blank" rel="noopener" aria-label="WhatsApp the shop">WhatsApp</a>` : ""}`;
  $("#bar").hidden = false;
  $("#pdf").onclick = () => window.print();
}

async function load() {
  if (!/^[a-z0-9]{12,20}$/.test(t)) { $("#app").innerHTML = `<div class="msg"><b>Bill not found</b>Check the link you were sent.</div>`; return; }
  try {
    const r = await fetch("/api/qr", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "bl-get", t }), cache: "no-store" });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "This bill couldn't load.");
    const go = () => window.KSGST ? render(j.bill) : setTimeout(go, 100); go();
  } catch (e) { $("#app").innerHTML = `<div class="msg"><b>Bill not found</b>${esc(e.message)}</div>`; }
}
load();
})();
</script>
</body>
</html>
