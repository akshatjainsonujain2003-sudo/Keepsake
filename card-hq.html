<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Card HQ · Keepsake</title>
<meta name="theme-color" content="#3D0A19">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Parisienne&display=swap">
<style>
/* Card HQ: the owner's app for the physical gift cards. Phone first: one column, bottom tabs. Same colours as the gifts site. */
:root{--bg:#FFF1EF;--card:#FFFAF8;--ln:#F6CFD3;--ink:#4A0D1F;--mu:#7E4A57;--ch:#C8143F;--deep:#3D0A19;--bu:#FFE08A;--ro:#FF8FA3;--ok:#1F7A4D;--bad:#B3261E;
  --sa:env(safe-area-inset-bottom);--st:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.5 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ch)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ch);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:"Inter Tight","DM Sans",system-ui,sans-serif;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin:0}
/* login */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px;color:#FFE9EC;background:radial-gradient(70% 45% at 50% 18%,#E0446Ccc,#0000 70%),linear-gradient(#8E0F31,#4A0D1F 70%,#3D0A19)}
#login .bx{width:min(380px,100%);text-align:center}
#login .lg{font:400 54px/1 Parisienne,cursive;color:#fff}
#login h1{margin:10px 0 6px;font-size:26px;color:#fff}
#login p{margin:0 0 22px;color:#FFD9DE}
#login .in{background:#ffffff1f;border-color:#ffffff4d;color:#fff;text-align:center}
#login .in::placeholder{color:#ffffff99}
#login .bt{background:var(--bu);color:var(--deep)}
#login .err{color:var(--bu)}
/* controls */
.in{width:100%;min-height:48px;padding:11px 14px;border-radius:14px;border:1px solid var(--ln);background:#fff;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:var(--ch);box-shadow:0 0 0 4px #C8143F1f}
textarea.in{min-height:76px;resize:vertical}
label.f{display:block;margin:0 0 14px;font-size:13.5px;font-weight:600;color:var(--mu)}
label.f .in{margin-top:6px;font-weight:400;color:var(--ink)}
label.f small{display:block;margin-top:5px;font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--ch);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .12s,background .15s}
.bt:hover{background:#A30F32}.bt:active{transform:scale(.98)}.bt[disabled]{opacity:.6;cursor:wait}
.bt.w{width:100%}.bt.gh{background:#fff;color:var(--ch);border:1px solid #C8143F40}.bt.gh:hover{background:#FFE4E6}
.bt.sm{min-height:40px;padding:0 15px;font-size:14px}
.bt.dz{background:#fff;color:var(--bad);border:1px solid #B3261E55}.bt.dz:hover{background:#FDECEA}
.err{color:var(--bad);min-height:1.4em;margin:10px 0 0;font-size:14px}
.okm{color:var(--ok)}
/* shell */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 10px) 16px 10px;background:#3D0A19f5;color:#fff;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.bar .lg{font:400 30px/1 Parisienne,cursive;color:#fff;text-decoration:none}
.bar .tg{padding:4px 9px;border-radius:99px;background:var(--bu);color:var(--deep);font:700 11.5px/1 "DM Sans",sans-serif}
.bar .sp{flex:1}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid #ffffff40;background:#ffffff14;color:#fff;display:grid;place-items:center;cursor:pointer}
.ib svg{width:19px;height:19px}.ib.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
main{max-width:760px;margin:0 auto;padding:18px 16px calc(var(--sa) + 104px)}
.hd{margin:6px 0 16px}.hd h1{font-size:30px;color:var(--ch)}.hd p{margin:6px 0 0;color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 8px calc(var(--sa) + 8px);background:#FFFAF8f2;border-top:1px solid var(--ln);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
nav div{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:5px 0;border:0;border-radius:14px;background:none;font-size:12px;font-weight:600;color:var(--mu);cursor:pointer}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--ch)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:18px;margin:0 0 12px}
.card h2{font-size:20px;margin:0 0 4px}.card h3{font-size:17px}
.card>p{margin:0 0 14px;color:var(--mu);font-size:14.5px}
.lab{font-size:12.5px;font-weight:600;color:var(--mu)}
/* overview */
.hero{position:relative;overflow:hidden;color:#fff;border:0;background:radial-gradient(70% 90% at 100% 0%,#E0446Ccc,#0000 65%),linear-gradient(140deg,#8E0F31,#4A0D1F)}
.hero .lab{color:#FFD9DE}
.big{font:700 52px/1 "Inter Tight",sans-serif;letter-spacing:-.045em;margin:8px 0 2px}
.big small{font:500 15px "DM Sans",sans-serif;letter-spacing:0;color:#FFD9DE;margin-left:8px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.g4 .card{margin:0;padding:14px 16px}
.g4 b{display:block;font:700 26px/1.1 "Inter Tight",sans-serif;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
@media (min-width:620px){.g4{grid-template-columns:repeat(4,1fr)}}
.chart{display:flex;align-items:flex-end;gap:3px;height:96px;margin-top:14px}
.chart i{flex:1;min-height:3px;border-radius:5px 5px 2px 2px;background:#F6CFD3}
.chart i.on{background:linear-gradient(var(--bu),var(--ro))}
.ax{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:600;color:var(--mu);text-align:right;padding:6px 6px 8px}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:10px 6px;border-top:1px solid var(--ln);text-align:right}
td:last-child,th:last-child{padding-right:0}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.empty{padding:26px 10px;text-align:center;color:var(--mu)}
.empty b{display:block;font:700 19px "Inter Tight",sans-serif;letter-spacing:-.02em;color:var(--ink);margin-bottom:4px}
/* stage bar + chips */
.sbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#F6CFD3;margin:12px 0 8px}
.sbar i{display:block}
.s-printing{background:#D9B8BE}.s-stock{background:var(--bu)}.s-shop{background:var(--ro)}.s-sold{background:#E0446C}.s-active{background:var(--ok)}.s-void{background:#8B8086}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mu)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:9px;height:9px;border-radius:50%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:#FFE4E6;color:var(--ch);white-space:nowrap}
.chip.c-active{background:#DDF3E7;color:var(--ok)}.chip.c-void{background:#ECE6E8;color:#5E5459}.chip.c-stock{background:#FFF3C9;color:#6B4E00}.chip.c-printing{background:#F3E4E6;color:var(--mu)}
/* lists */
.li{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin:0 0 10px;cursor:pointer;transition:border-color .15s,transform .15s}
.li:hover{border-color:var(--ch)}
.li .t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.li .t b{font:700 18px "Inter Tight",sans-serif;letter-spacing:-.02em}
.li .t small,.li p{color:var(--mu);font-size:13.5px}
.li p{margin:4px 0 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mono{font:600 14px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;margin:0 0 8px;padding:0;border:0;background:none;color:var(--ch);font-weight:600;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:14px 0 0;font-size:14.5px}
.kv dt{color:var(--mu)}.kv dd{margin:0;text-align:right;font-weight:600}
.pin{font:700 26px ui-monospace,Menlo,monospace;letter-spacing:.18em}
#toast{position:fixed;left:50%;bottom:calc(var(--sa) + 92px);z-index:40;translate:-50% 0;max-width:calc(100% - 32px);padding:11px 18px;border-radius:99px;background:var(--deep);color:#fff;font-weight:600;font-size:14.5px;box-shadow:0 14px 30px -14px #3D0A19;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<div id="login">
  <form class="bx" id="lf">
    <div class="lg">Keepsake</div>
    <h1>Card HQ</h1>
    <p>Print runs, stock and activations for your gift cards.</p>
    <input class="in" id="lk" type="password" autocomplete="current-password" placeholder="Admin key" aria-label="Admin key" required>
    <button class="bt w" style="margin-top:12px">Open Card HQ</button>
    <div class="err" id="le" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="bar"><a class="lg" href="/card-hq">Keepsake</a><span class="tg">Card HQ</span><span class="sp"></span>
    <button class="ib" id="rf" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
    <button class="ib" id="lo" aria-label="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav aria-label="Sections"><div>
    <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/></svg>Overview</button>
    <button data-tab="runs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 17H4a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-2M6 14h12v7H6z"/></svg>Print runs</button>
    <button data-tab="designs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M14 10h3v3h-3zM7 14h3"/></svg>Designs</button>
    <button data-tab="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.300-4.300"/></svg>Find a card</button>
  </div></nav>
</div>
<div id="toast" role="status"></div>

<script>
(function(){
  var KK="ks-hq-key",KEY="";try{KEY=localStorage.getItem(KK)||""}catch(e){}
  var $=function(s,r){return (r||document).querySelector(s)},V=$("#view"),S=null,tab="home",sub=null;
  var esc=function(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
  var STG={printing:"At the printer",stock:"In stock",shop:"With a shop",sold:"Sold directly",active:"Activated",void:"Cancelled"},ORD=["printing","stock","shop","sold","active","void"];
  var TIER={site:"Love-story website",card:"Memory card"};
  var dt=function(t){return t?new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):""};
  function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("on")},2600)}
  async function api(b){
    var r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":KEY},body:JSON.stringify(b)});
    var j=await r.json().catch(function(){return {}});
    if(r.status===401||r.status===429){var e=new Error(j.error||"Wrong admin key.");e.auth=true;throw e}
    if(!r.ok)throw new Error(j.error||"Something went wrong. Try again.");
    return j;
  }
  function show(on){$("#login").hidden=on;$("#app").hidden=!on}
  async function load(){
    $("#rf").classList.add("spin");
    try{S=await api({action:"cards-summary"});show(true);render()}
    catch(e){if(e.auth){show(false);$("#le").textContent=KEY?e.message:""}else{show(true);V.innerHTML='<div class="card empty"><b>Could not load</b>'+esc(e.message)+'</div>'}}
    finally{$("#rf").classList.remove("spin")}
  }
  $("#lf").onsubmit=function(e){e.preventDefault();KEY=$("#lk").value.trim();try{localStorage.setItem(KK,KEY)}catch(x){}$("#le").textContent="";load()};
  $("#lo").onclick=function(){KEY="";try{localStorage.removeItem(KK)}catch(x){}$("#lk").value="";show(false)};
  $("#rf").onclick=function(){sub&&sub.run?openRun(sub.run):load()};
  [].forEach.call(document.querySelectorAll("nav button"),function(b){b.onclick=function(){tab=b.dataset.tab;sub=null;render();scrollTo(0,0)}});

  function sbar(t){var n=t.made||1;return '<div class="sbar" role="img" aria-label="Where the cards are">'+ORD.map(function(k){return t[k]?'<i class="s-'+k+'" style="width:'+(t[k]/n*100)+'%"></i>':""}).join("")+"</div>"}
  function legend(t){return '<div class="leg">'+ORD.filter(function(k){return t[k]}).map(function(k){return '<span><i class="s-'+k+'"></i>'+STG[k]+" "+t[k]+"</span>"}).join("")+"</div>"}

  function render(){
    [].forEach.call(document.querySelectorAll("nav button"),function(b){b.classList.toggle("on",b.dataset.tab===tab)});
    if(tab==="home")home();else if(tab==="runs")runs();else if(tab==="designs")designs();else find();
  }

  // ---------- overview ----------
  function home(){
    var t=S.total,mx=Math.max.apply(null,S.days.map(function(d){return d.n}).concat(1)),m30=S.days.reduce(function(a,d){return a+d.n},0);
    if(!S.designs.length){V.innerHTML='<div class="hd"><h1>Card HQ</h1><p>Everything about your printed gift cards, in one place.</p></div><div class="card empty"><b>Start with a card design</b>Add your first design (for example Wildflower), then make a print run for it.<div class="acts" style="justify-content:center"><button class="bt" id="go">Add a design</button></div></div>';$("#go").onclick=function(){tab="designs";sub={form:{}};render()};return}
    V.innerHTML='<div class="hd"><h1>Overview</h1><p>'+t.made+" card"+(t.made===1?"":"s")+" made across "+S.runs.length+" print run"+(S.runs.length===1?"":"s")+'.</p></div>'+
      '<div class="card hero"><div class="lab">Activated in the last 30 days</div><div class="big">'+m30+'<small>'+t.active+' in total</small></div>'+
      '<div class="chart" role="img" aria-label="Activations per day, last 30 days">'+S.days.map(function(d){return '<i class="'+(d.n?"on":"")+'" style="height:'+Math.max(3,d.n/mx*100)+'%;'+(d.n?"":"background:#ffffff33")+'" title="'+esc(d.d)+": "+d.n+'"></i>'}).join("")+'</div>'+
      '<div class="ax" style="color:#FFD9DE"><span>30 days ago</span><span>Today</span></div></div>'+
      '<div class="g4"><div class="card"><span class="lab">At the printer</span><b>'+t.printing+'</b></div><div class="card"><span class="lab">In stock</span><b>'+t.stock+'</b></div><div class="card"><span class="lab">With shops</span><b>'+t.shop+'</b></div><div class="card"><span class="lab">Sold directly</span><b>'+t.sold+'</b></div></div>'+
      '<div class="card"><h2>By design</h2><div class="tw"><table><thead><tr><th>Design</th><th>Made</th><th>Stock</th><th>Shops</th><th>Sold</th><th>Activated</th></tr></thead><tbody>'+
        S.designs.map(function(d){return "<tr><td>"+esc(d.name)+"</td><td>"+d.made+"</td><td>"+d.stock+"</td><td>"+d.shop+"</td><td>"+d.sold+"</td><td>"+d.active+"</td></tr>"}).join("")+'</tbody></table></div></div>'+
      '<div class="card"><h2>By shop</h2>'+(S.shops.length?'<div class="tw"><table><thead><tr><th>Shop</th><th>Cards given</th><th>Activated</th><th>Still unused</th></tr></thead><tbody>'+
        S.shops.map(function(s){return "<tr><td>"+esc(s.name)+"</td><td>"+s.given+"</td><td>"+s.active+"</td><td>"+(s.given-s.active)+"</td></tr>"}).join("")+'</tbody></table></div>':'<div class="empty">No cards are with a shop yet. Open a print run and choose “Give to a shop”.</div>')+'</div>';
  }

  // ---------- designs ----------
  function designs(){
    if(sub&&sub.form)return designForm(sub.form);
    V.innerHTML='<div class="hd"><h1>Card designs</h1><p>One entry for each physical card you print.</p></div>'+
      (S.designs.length?S.designs.map(function(d){return '<button class="li" data-id="'+esc(d.id)+'"><span class="t"><b>'+esc(d.name)+'</b><small>'+(d.active===false?"Archived":TIER[d.tier])+'</small></span><p>'+d.made+" made · "+d.active+" activated · QR "+d.qrSize+' mm</p>'+(d.note?"<p>"+esc(d.note)+"</p>":"")+"</button>"}).join(""):'<div class="card empty"><b>No designs yet</b>Add one for each card you plan to print.</div>')+
      '<button class="bt w" id="nd">Add a design</button>';
    $("#nd").onclick=function(){sub={form:{}};render()};
    [].forEach.call(V.querySelectorAll(".li"),function(b){b.onclick=function(){sub={form:S.designs.filter(function(d){return d.id===b.dataset.id})[0]};render()}});
  }
  function designForm(d){
    V.innerHTML='<button class="back" id="bk">← Designs</button><form class="card" id="df"><h2>'+(d.id?"Edit design":"New design")+'</h2><p>The artwork can be added later; you only need a name to start making codes.</p>'+
      '<label class="f">Design name<input class="in" name="name" maxlength="40" required value="'+esc(d.name||"")+'" placeholder="Wildflower"></label>'+
      '<label class="f">What this card unlocks<select class="in" name="tier"><option value="site">Love-story website</option><option value="card"'+(d.tier==="card"?" selected":"")+'>Memory card</option></select></label>'+
      '<label class="f">QR size on the card (mm)<input class="in" name="qrSize" type="number" inputmode="numeric" min="12" max="40" value="'+esc(d.qrSize||20)+'"><small>20 mm scans well on a credit-card-size card.</small></label>'+
      '<label class="f">Front artwork link (optional)<input class="in" name="front" type="url" inputmode="url" placeholder="https://" value="'+esc(d.front||"")+'"></label>'+
      '<label class="f">Back artwork link (optional)<input class="in" name="back" type="url" inputmode="url" placeholder="https://" value="'+esc(d.back||"")+'"></label>'+
      '<label class="f">Notes for the printer (optional)<textarea class="in" name="note" maxlength="200" placeholder="Clear 1.5 mm acrylic, white ink under the flowers">'+esc(d.note||"")+'</textarea></label>'+
      '<div class="acts"><button class="bt">Save design</button>'+(d.id?'<button type="button" class="bt gh" id="ar">'+(d.active===false?"Bring back":"Archive")+"</button>":"")+'</div><div class="err" role="alert"></div></form>';
    $("#bk").onclick=function(){sub=null;render()};
    var f=$("#df"),save=async function(active){var b={action:"cards-design-save",id:d.id,active:active};["name","tier","qrSize","front","back","note"].forEach(function(k){b[k]=f.elements[k].value});
      try{await api(b);toast("Design saved");sub=null;await load()}catch(e){f.querySelector(".err").textContent=e.message}};
    f.onsubmit=function(e){e.preventDefault();save(d.active!==false)};
    if($("#ar"))$("#ar").onclick=function(){save(d.active===false)};
  }

  // ---------- print runs ----------
  function runs(){
    if(sub&&sub.run)return openRun(sub.run);
    var act=S.designs.filter(function(d){return d.active!==false});
    V.innerHTML='<div class="hd"><h1>Print runs</h1><p>Each run makes the codes and PINs for one batch of cards.</p></div>'+
      (act.length?'<form class="card" id="nr"><h2>New print run</h2><p>Up to 200 cards in one run. For a bigger order, make more runs.</p><div class="row2">'+
        '<label class="f">Design<select class="in" name="design">'+act.map(function(d){return '<option value="'+esc(d.id)+'">'+esc(d.name)+"</option>"}).join("")+'</select></label>'+
        '<label class="f">How many cards<input class="in" name="count" type="number" inputmode="numeric" min="1" max="200" value="50" required></label></div>'+
        '<label class="f">Note (optional)<input class="in" name="note" maxlength="120" placeholder="First order, December"></label>'+
        '<button class="bt w">Make the codes</button><div class="err" role="alert"></div></form>':'<div class="card empty"><b>Add a design first</b>A print run needs a card design.<div class="acts" style="justify-content:center"><button class="bt" id="go">Add a design</button></div></div>')+
      (S.runs.length?S.runs.map(function(r){return '<button class="li" data-id="'+esc(r.id)+'"><span class="t"><b>'+esc(r.name)+" · "+r.count+' cards</b><small>'+dt(r.created)+'</small></span>'+(r.note?"<p>"+esc(r.note)+"</p>":"")+sbar(r)+legend(r)+"</button>"}).join(""):"");
    if($("#go"))$("#go").onclick=function(){tab="designs";sub={form:{}};render()};
    var f=$("#nr");if(f)f.onsubmit=async function(e){e.preventDefault();var bt=f.querySelector("button");bt.disabled=true;bt.textContent="Making codes…";
      try{var j=await api({action:"cards-run-create",design:f.elements.design.value,count:f.elements.count.value,note:f.elements.note.value});toast(j.run.count+" codes made");await load();openRun(j.run.id)}
      catch(x){f.querySelector(".err").textContent=x.message;bt.disabled=false;bt.textContent="Make the codes"}};
    [].forEach.call(V.querySelectorAll(".li"),function(b){b.onclick=function(){openRun(b.dataset.id)}});
  }
  async function openRun(id){
    sub={run:id};tab="runs";[].forEach.call(document.querySelectorAll("nav button"),function(b){b.classList.toggle("on",b.dataset.tab===tab)});
    var j;try{j=await api({action:"cards-run",id:id})}catch(e){V.innerHTML='<button class="back" id="bk">← Print runs</button><div class="card empty"><b>Could not open this run</b>'+esc(e.message)+"</div>";$("#bk").onclick=function(){sub=null;render()};return}
    var r=j.run,t=j.tally,shops=S.shops.map(function(s){return s.name});
    var opt=function(k){return t[k]?'<option value="'+k+'">'+STG[k]+" ("+t[k]+")</option>":""};
    V.innerHTML='<button class="back" id="bk">← Print runs</button><div class="hd"><h1>'+esc(r.name)+'</h1><p>'+r.count+" cards · "+TIER[r.tier]+" · made "+dt(r.created)+(r.note?" · "+esc(r.note):"")+'</p></div>'+
      '<div class="card">'+sbar(t)+legend(t)+'</div>'+
      '<div class="card"><h2>Files for the printer</h2><p>QR images and a list of codes for the cards, and a sheet of PIN inserts for the packs.</p><div class="acts"><a class="bt" href="/print-cards?run='+encodeURIComponent(r.id)+'" target="_blank" rel="noopener">Open print files</a></div></div>'+
      '<form class="card" id="mv"><h2>Move cards</h2><p>Cards move in print order, starting from the lowest number.</p>'+
        '<div class="row2"><label class="f">From<select class="in" name="from">'+opt("printing")+opt("stock")+opt("shop")+opt("sold")+'</select></label>'+
        '<label class="f">To<select class="in" name="to"><option value="stock">In stock</option><option value="shop">With a shop</option><option value="sold">Sold directly</option><option value="printing">At the printer</option></select></label></div>'+
        '<div class="row2"><label class="f">How many<input class="in" name="count" type="number" inputmode="numeric" min="1" max="'+r.count+'" placeholder="All"></label>'+
        '<label class="f" id="wl">Shop name<input class="in" name="where" maxlength="60" list="shl"><datalist id="shl">'+shops.map(function(s){return '<option value="'+esc(s)+'">'}).join("")+'</datalist></label></div>'+
        '<button class="bt w">Move cards</button><div class="err" role="alert"></div></form>'+
      '<div class="card"><h2>Cards</h2><div class="tw"><table><thead><tr><th>No.</th><th style="text-align:left">Code</th><th>Where</th><th>Status</th></tr></thead><tbody>'+
        j.cards.map(function(c){var k=c.status==="new"?c.stage:c.status;return '<tr><td>'+c.n+'</td><td style="text-align:left"><a href="#" class="mono" data-c="'+c.code+'">'+c.code+'</a></td><td>'+esc(c.where||"")+'</td><td><span class="chip c-'+k+'">'+STG[k]+(c.locked?" · locked":"")+"</span></td></tr>"}).join("")+'</tbody></table></div></div>';
    $("#bk").onclick=function(){sub=null;load()};
    var f=$("#mv"),wl=$("#wl"),sync=function(){var to=f.elements.to.value;wl.hidden=!(to==="shop"||to==="sold");wl.firstChild.textContent=to==="sold"?"Where it was sold (optional)":"Shop name"};
    f.elements.to.onchange=sync;sync();
    if(!f.elements.from.options.length){f.querySelector("button").disabled=true;f.querySelector(".err").textContent="Every card in this run is activated or cancelled."}
    f.onsubmit=async function(e){e.preventDefault();var er=f.querySelector(".err");er.textContent="";
      if(f.elements.from.value===f.elements.to.value&&f.elements.to.value!=="shop"){er.textContent="Choose a different place to move the cards to.";return}
      try{var m=await api({action:"cards-move",run:r.id,from:f.elements.from.value,to:f.elements.to.value,count:f.elements.count.value||"all",where:f.elements.where.value});
        toast(m.moved+" card"+(m.moved===1?"":"s")+" moved");S=await api({action:"cards-summary"});openRun(r.id)}catch(x){er.textContent=x.message}};
    [].forEach.call(V.querySelectorAll("[data-c]"),function(a){a.onclick=function(e){e.preventDefault();tab="find";sub={q:a.dataset.c};render();scrollTo(0,0)}});
  }

  // ---------- find a card ----------
  function find(){
    V.innerHTML='<div class="hd"><h1>Find a card</h1><p>Type the code, or paste the link the card’s QR opens.</p></div>'+
      '<form class="card" id="ff"><label class="f">Card code or link<input class="in mono" name="q" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="KSAB12CD34" required value="'+esc(sub&&sub.q||"")+'"></label><button class="bt w">Find</button><div class="err" role="alert"></div></form><div id="fr"></div>';
    var f=$("#ff");f.onsubmit=function(e){e.preventDefault();look(f.elements.q.value)};
    if(sub&&sub.q)look(sub.q);
  }
  async function look(q){
    var er=$("#ff .err"),out=$("#fr");er.textContent="";out.innerHTML="";
    var c;try{c=(await api({action:"cards-find",q:q})).card}catch(e){er.textContent=e.message;return}
    var k=c.status==="new"?c.stage:c.status;
    out.innerHTML='<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><b class="mono" style="font-size:20px">'+c.code+'</b><span class="chip c-'+k+'">'+STG[k]+'</span></div>'+
      '<dl class="kv">'+(c.run?'<dt>Design</dt><dd>'+esc(c.run.name)+'</dd><dt>Print run</dt><dd><a href="#" id="or">'+dt(c.run.created)+" · "+c.run.count+' cards</a></dd><dt>Number in the run</dt><dd>'+c.n+" of "+c.run.count+'</dd>':'<dt>Type</dt><dd>Prepaid code (not a printed gift card)</dd>')+
      '<dt>Unlocks</dt><dd>'+esc(TIER[c.tier]||c.tier)+'</dd>'+(c.where?'<dt>'+(c.stage==="shop"?"Shop":"Sold through")+'</dt><dd>'+esc(c.where)+'</dd>':"")+
      (c.status==="active"?'<dt>Activated</dt><dd>'+dt(c.claimedAt)+'</dd><dt>Their page</dt><dd><a href="'+esc(c.page)+'" target="_blank" rel="noopener">Open</a></dd>':'<dt>Wrong PIN tries</dt><dd>'+c.fails+(c.locked?" · locked":"")+'</dd>')+
      '<dt>PIN</dt><dd><button class="bt gh sm" id="sp">Show PIN</button></dd></dl>'+
      '<div class="acts">'+(c.locked?'<button class="bt" id="ul">Unlock card</button>':"")+(c.status==="new"?'<button class="bt dz" id="vd">Cancel this card</button>':c.status==="void"?'<button class="bt" id="rs">Bring card back</button>':"")+'</div><div class="err" role="alert"></div></div>';
    var e2=out.querySelector(".err"),act=function(b,msg){return async function(){try{await api(b);toast(msg);look(c.code)}catch(x){e2.textContent=x.message}}};
    $("#sp").onclick=function(){this.outerHTML='<span class="pin">'+esc(c.pin)+"</span>"};
    if($("#or"))$("#or").onclick=function(e){e.preventDefault();openRun(c.run.id);scrollTo(0,0)};
    if($("#ul"))$("#ul").onclick=act({action:"cards-unlock",q:c.code},"Card unlocked");
    if($("#rs"))$("#rs").onclick=act({action:"cards-void",q:c.code,on:false},"Card is usable again");
    if($("#vd"))$("#vd").onclick=function(){var b=this;if(b.dataset.sure){act({action:"cards-void",q:c.code,on:true},"Card cancelled")()}else{b.dataset.sure="1";b.textContent="Tap again to cancel it";e2.textContent="A cancelled card can’t be activated. You can bring it back later."}};
  }

  if(KEY)load();else show(false);
})();
</script>
</body></html>
