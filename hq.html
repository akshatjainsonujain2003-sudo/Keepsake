<style>
:root{--bg:#0B0B14;--card:#14141F;--card2:#1C1C2A;--ln:#262636;--tx:#F2F2EE;--mu:#9A9AAE;--gd:#D4FF3F;--ac:#1F1BF2;--ac2:#3B35FF;--lav:#8C82FF;--gn:#5FE3A1;--rd:#FF7A7A;--bl:#8C82FF;--sa:env(safe-area-inset-bottom);--st:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gd)}
.fd{font-family:'Inter Tight','Inter',sans-serif;font-weight:800;letter-spacing:-.035em}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
/* login */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(70% 55% at 85% 0%,#3B35FF66,transparent 60%),radial-gradient(60% 50% at 0% 100%,#1F1BF244,transparent 60%),var(--bg)}
#login .bx{width:min(380px,100%);text-align:center;padding:34px 26px 28px;border-radius:28px;background:#14141Fcc;border:1px solid var(--ln);backdrop-filter:blur(10px)}
#login .lg{width:68px;height:68px;border-radius:20px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(160deg,#140FD6,#3B35FF);box-shadow:0 18px 40px -16px #3B35FF}
#login .lg svg{width:38px;height:38px}
#login h1{margin:0 0 6px;font-size:28px}#login p{color:var(--mu);margin:0 0 22px}
#login .mono{display:block;margin-top:14px;font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
.in{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--ln);background:var(--card2);font-size:16px;outline:none;transition:border-color .15s}
.in:focus{border-color:var(--ac2)}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:999px;border:0;background:var(--gd);color:#0B0B14;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .12s,filter .12s}
.bt:hover{filter:brightness(1.05)}.bt:active{transform:scale(.98)}
.bt.w{width:100%;margin-top:12px}.bt.gh{background:var(--card2);color:var(--tx);border:1px solid var(--ln)}.bt.sm{padding:9px 14px;font-size:14px}
.err{color:var(--rd);min-height:1.4em;margin-top:10px;font-size:14px}
/* shell */
#app{padding:calc(var(--st) + 16px) 16px calc(var(--sa) + 96px);max-width:680px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.top h1{margin:0;font-size:28px;line-height:1.05}.top small{display:block;color:var(--mu);font:600 11px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{border-color:var(--ac2)}
.ib svg{width:20px;height:20px}.ib.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0B0B14ee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:8px 8px calc(var(--sa) + 8px);display:flex;justify-content:center}
nav .brand{display:none}
nav .in2{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:680px}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mu);padding:4px 0;cursor:pointer;position:relative;border-radius:14px}
nav button svg{width:23px;height:23px}nav button.on{color:var(--gd)}
nav .dot{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rd);color:#0B0B14;font-size:11px;font-weight:800;display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:18px;margin-bottom:12px}
.hero{position:relative;overflow:hidden;background:radial-gradient(80% 90% at 100% 0%,#8C82FF55,transparent 60%),linear-gradient(160deg,#140FD6 0%,#1F1BF2 55%,#3B35FF 100%);border-color:#3B35FF;color:#fff}
.hero .lab,.hero .big small{color:#D9D8FF}.hero a{color:#fff}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:1.5px solid #D4FF3F55;pointer-events:none}
.lab{font:600 11px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.big{font:800 44px/1.02 'Inter Tight',sans-serif;letter-spacing:-.04em;margin:8px 0 2px}.big small{font:600 14px Inter,sans-serif;letter-spacing:0;color:var(--mu);margin-left:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.g3 .card{margin:0;padding:14px}.g3 b{display:block;font:800 21px 'Inter Tight',sans-serif;letter-spacing:-.02em;margin-top:4px}.g3 small{color:var(--mu);font-size:12px}
.alert{display:flex;align-items:center;gap:14px;background:#2A1420;border-color:#5A2236;cursor:pointer}
.alert .n{font-size:32px;color:var(--rd)}.alert b{display:block}.alert small{color:#F0C2C8}
.alert svg{margin-left:auto;width:20px;height:20px;flex:none}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:14px}
.chart i{flex:1;background:#262636;border-radius:5px 5px 2px 2px;min-height:3px;position:relative}
.chart i.v{background:var(--gd)}.chart i.t{background:var(--lav)}
.hero .chart i{background:#ffffff33}.hero .chart i.v{background:var(--gd)}.hero .chart i.t{background:#fff}
.cx{display:flex;justify-content:space-between;color:var(--mu);font:500 11px 'JetBrains Mono',monospace;margin-top:6px}.hero .cx{color:#D9D8FF}
.mix{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:12px 0 10px;background:#262636}
.mix span{display:block}.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mu)}.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 10px}.sec h2{margin:0;font:800 19px 'Inter Tight',sans-serif;letter-spacing:-.02em}.sec button{background:none;border:0;color:var(--gd);font-weight:600;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);border:1px solid var(--ln);border-radius:18px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;transition:border-color .15s,background .15s}
.row:hover{border-color:#3B35FF;background:#171726}
.row .av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card2);flex:none;font-size:18px}
.row .mid{flex:1;min-width:0}.row .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .mid small{display:block;color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;flex:none}.row .rt b{display:block;font-variant-numeric:tabular-nums}.row .rt small{color:var(--mu);font-size:12px}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em}
.tag.r{background:#3A1822;color:var(--rd)}.tag.g{background:#123326;color:var(--gn)}.tag.y{background:#2E3A10;color:var(--gd)}.tag.m{background:var(--card2);color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--ln);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--gd);color:#0B0B14;border-color:var(--gd)}
.srch{position:relative;margin-bottom:10px}.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mu)}.srch .in{padding-left:42px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.load{text-align:center;color:var(--mu);padding:30px}
/* sheet */
.ov{position:fixed;inset:0;z-index:40;background:#05050Acc;opacity:0;pointer-events:none;transition:.2s}.ov.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88dvh;overflow:auto;background:#12121C;border-top:1px solid var(--ln);border-radius:26px 26px 0 0;padding:10px 18px calc(var(--sa) + 24px);transform:translateY(105%);transition:transform .25s ease;max-width:680px;margin:0 auto}
.sh.on{transform:none}
.sh .gr{width:40px;height:5px;border-radius:3px;background:#33334A;margin:0 auto 14px}
.sh h3{margin:0 0 4px;font:800 23px 'Inter Tight',sans-serif;letter-spacing:-.03em}.sh .sub{color:var(--mu);margin:0 0 14px;font-size:14px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14px;margin:12px 0}.kv dt{color:var(--mu)}.kv dd{margin:0;word-break:break-word}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.addr{white-space:pre-line;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;font-size:14px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:12px 0}
.row .ck{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;border:2px solid var(--ln);color:transparent}.row.on{border-color:var(--gd)}.row.on .ck{background:var(--gd);border-color:var(--gd);color:#0B0B14}.row .ck svg{width:20px;height:20px}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sa) + 84px);z-index:19;width:min(640px,calc(100% - 24px));display:flex;align-items:center;gap:10px;padding:10px 10px 10px 18px;border-radius:999px;background:#1C1C2Af5;border:1px solid var(--ln);box-shadow:0 18px 40px -12px #000c;backdrop-filter:blur(12px)}
.selbar b{flex:1;font-variant-numeric:tabular-nums}.selbar .lk{background:none;border:0;color:var(--mu);font:600 14px inherit;cursor:pointer;padding:8px}
.durs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.durs button{padding:14px 6px;border-radius:14px;border:1px solid var(--ln);background:var(--card2);color:var(--tx);font-weight:700;cursor:pointer}.durs button small{display:block;font-weight:500;color:var(--mu);font-size:12px;margin-top:2px}.durs button.on{border-color:var(--gd);background:#2E3A10;color:var(--gd)}.durs button.on small{color:var(--gd)}
.box h4{margin:0 0 8px;font:600 11px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-160%);z-index:60;background:var(--gd);color:#0B0B14;padding:12px 18px;border-radius:999px;font-weight:700;transition:transform .3s;box-shadow:0 10px 30px #0008;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0)}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}.li>a,.li>small{flex:none;white-space:nowrap}.li:last-child{border-bottom:0}.li small{display:block;color:var(--mu);font-size:13px}
.sw{width:50px;height:30px;border-radius:15px;background:#33334A;border:0;position:relative;cursor:pointer;flex:none}.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ac2)}.sw.on:after{left:23px}
/* desktop: side rail, wider canvas */
@media (min-width:960px){
  nav{top:0;right:auto;width:232px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--ln);padding:26px 14px;background:#0B0B14}
  nav .brand{display:flex;align-items:center;gap:10px;padding:0 10px 26px;color:var(--tx);text-decoration:none}
  nav .brand svg{width:30px;height:30px;flex:none}nav .brand b{display:block;font:800 18px 'Inter Tight',sans-serif;letter-spacing:-.04em}nav .brand small{display:block;font:600 9px 'JetBrains Mono',monospace;letter-spacing:.22em;color:var(--gd);text-transform:uppercase;margin-top:3px}
  nav .in2{grid-template-columns:1fr;gap:4px;max-width:none}
  nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;font-size:14.5px}
  nav button:hover{background:var(--card);color:var(--tx)}
  nav button.on{background:var(--ac);color:#fff}
  nav button svg{width:20px;height:20px}
  nav .dot{position:static;margin-left:auto}
  #app{max-width:1080px;margin:0 0 0 232px;padding:32px 40px 60px}
  .top h1{font-size:36px}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .big{font-size:56px}
  .sh{left:50%;right:auto;bottom:auto;top:50%;width:min(620px,calc(100% - 48px));max-height:86vh;border:1px solid var(--ln);border-radius:26px;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s;padding:18px 24px 26px}
  .sh.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sh .gr{display:none}
  .toast{top:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<section id="login" hidden><div class="bx">
  <div class="lg"><svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M5 15V9a4 4 0 0 1 4-4h6"/><path d="M33 5h6a4 4 0 0 1 4 4v6"/><path d="M43 33v6a4 4 0 0 1-4 4h-6"/><path d="M15 43H9a4 4 0 0 1-4-4v-6"/></g><rect x="11" y="22" width="26" height="4" rx="2" fill="#D4FF3F"/></svg></div><h1 class="fd">GetKeepsake HQ</h1><p>Orders, shops and owners for GetKeepsake for Business.</p>
  <input class="in" id="key" type="password" placeholder="Admin key" autocomplete="current-password">
  <button class="bt w" id="go">Open</button><div class="err" id="lerr"></div><span class="mono">Owner only · Admin key</span>
</div></section>

<main id="app" hidden></main>
<nav id="nav" hidden><a class="brand" href="/hq"><svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M5 15V9a4 4 0 0 1 4-4h6"/><path d="M33 5h6a4 4 0 0 1 4 4v6"/><path d="M43 33v6a4 4 0 0 1-4 4h-6"/><path d="M15 43H9a4 4 0 0 1-4-4v-6"/></g><rect x="11" y="22" width="26" height="4" rx="2" fill="#D4FF3F"/></svg><span><b>GetKeepsake</b><small>For business · HQ</small></span></a><div class="in2">
  <button data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>

<div class="ov" id="ov"></div><div class="sh" id="sh"></div><div class="toast" id="toast"></div>

<script>
(() => {
const $ = s => document.querySelector(s), esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rs = n => "₹" + Number(n || 0).toLocaleString("en-IN");
const KK = "ks-hq-key"; let KEY = ""; try { KEY = localStorage.getItem(KK) || ""; } catch (e) {}
const S = { sel: null, sum: null, orders: null, pages: null, people: null, team: null, tp: "week", tab: "home", of: "ship", pf: "live", q: { orders: "", shops: "", people: "" } };
const IC = { biz: "🏪", site: "💌", card: "🎴" };
const ago = t => { if (!t) return ""; const s = (Date.now() - t) / 1000; if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago"; if (s < 86400) return Math.floor(s / 3600) + "h ago"; if (s < 172800) return "yesterday"; return new Date(t).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: new Date(t).getFullYear() === new Date().getFullYear() ? undefined : "numeric" }); };
const when = t => t ? new Date(t).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";
const SHIP = (p, o) => p === "frameQr" || p === "frameNfc" || p === "bizQr" || !!(o && o.withQr);
const PLAN = { digital: "Digital", frameQr: "Photo frame + QR", frameNfc: "Photo frame + NFC", bizQr: "Printed QR delivered", loyalty: "Loyalty card" };
const planName = o => (PLAN[o.plan] || o.plan) + (o.withQr ? " + printed QR" : "");
const KIND = { biz: "Business page", site: "Website", card: "Memory card" };
const wa = p => { p = String(p || "").replace(/\D/g, ""); if (p.length === 10) p = "91" + p; return p.length >= 11 ? "https://wa.me/" + p : ""; };
const tel = p => { p = String(p || "").replace(/\D/g, ""); return p ? "tel:+" + (p.length === 10 ? "91" + p : p) : ""; };

async function api(b) {
  const r = await fetch("/api/admin", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-key": KEY }, body: JSON.stringify(b) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(true); throw new Error(j.error || "Wrong admin key."); }
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
}
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 3200); }
// The service worker reads the key from here to show order details in alerts.
async function keepKeyForAlerts() { try { const c = await caches.open("hq"); await c.put("/hq-key", new Response(KEY)); } catch (e) {} }

// ---------- login ----------
async function login() {
  KEY = $("#key").value.trim(); $("#lerr").textContent = "";
  if (!KEY) return;
  try { S.sum = await api({ action: "hq-summary" }); try { localStorage.setItem(KK, KEY); sessionStorage.ak = KEY; } catch (e) {} keepKeyForAlerts(); start(); }
  catch (e) { $("#lerr").textContent = e.message; }
}
function logout(bad) { try { localStorage.removeItem(KK); caches.delete("hq"); } catch (e) {} KEY = ""; $("#app").hidden = $("#nav").hidden = true; $("#login").hidden = false; if (bad) $("#lerr").textContent = "Please enter the admin key again."; }
$("#go").onclick = login; $("#key").onkeydown = e => { if (e.key === "Enter") login(); };

// ---------- shell ----------
function start() {
  $("#login").hidden = true; $("#app").hidden = $("#nav").hidden = false;
  const t = (location.hash || "#home").slice(1); go(["home", "orders", "shops", "team", "people", "more"].includes(t) ? t : "home");

// Give Pro free to one or more shops: pick how long, add an optional note, done.
function giveSheet(ids) {
  const ps = (S.pages || []).filter(p => ids.includes(p.id)), D = [[30, "1 month"], [90, "3 months"], [180, "6 months"], [365, "1 year"]];
  let days = 30;
  const until = p => new Date(Math.max(Date.now(), p.proUntil || 0) + days * 864e5).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
  const draw2 = () => { $("#gvSum").innerHTML = ps.length === 1 ? `Pro until <b>${until(ps[0])}</b>${ps[0].proUntil > Date.now() ? " (added to the days they already have)" : ""}` : `${days} days added to each shop. Shops already on Pro keep their days and get these on top.`; $("#gvGo").textContent = `Give ${days} days of Pro to ${ps.length} shop${ps.length === 1 ? "" : "s"}`; };
  sheet(`<h3>Give Pro free</h3><p class="sub">${ps.length === 1 ? esc(ps[0].title || "Untitled") : ps.length + " shops: " + esc(ps.slice(0, 3).map(p => p.title || "Untitled").join(", ")) + (ps.length > 3 ? " and " + (ps.length - 3) + " more" : "")}</p>
    <div class="durs">${D.map(([d, l], i) => `<button type="button" data-d="${d}" class="${i ? "" : "on"}">${l}<small>${d} days</small></button>`).join("")}</div>
    <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Or type the number of days</label><input id="gvDays" class="in" type="number" inputmode="numeric" min="1" max="730" placeholder="e.g. 14" style="margin-bottom:10px">
    <input id="gvNote" class="in" maxlength="120" placeholder="Note (optional): Diwali giveaway, trial, friend…">
    <div class="box" id="gvSum" style="color:var(--mu);font-size:14px"></div>
    <p style="color:var(--mu);font-size:13px;margin:0 0 4px">No payment is taken. They get the online store and every Pro tool. When it ends, their store goes back to WhatsApp orders and nothing is deleted.</p>
    <button class="bt w" id="gvGo"></button>`);
  draw2();
  $("#sh").querySelectorAll("[data-d]").forEach(b => b.onclick = () => { days = +b.dataset.d; $("#gvDays").value = ""; $("#sh").querySelectorAll("[data-d]").forEach(x => x.classList.toggle("on", x === b)); draw2(); });
  $("#gvDays").oninput = e => { const v = Math.round(+e.target.value); if (v >= 1 && v <= 730) { days = v; $("#sh").querySelectorAll("[data-d]").forEach(x => x.classList.toggle("on", +x.dataset.d === v)); draw2(); } };
  $("#gvGo").onclick = async () => {
    const b = $("#gvGo"); b.disabled = true; b.textContent = "Giving Pro…";
    try {
      const r = await api({ action: "hq-give-pro", ids: ps.map(p => p.id), days, note: $("#gvNote").value });
      toast(`Pro given to ${r.done.length} shop${r.done.length === 1 ? "" : "s"} for ${r.days} days` + (r.skipped.length ? ` · ${r.skipped.length} skipped (not live)` : ""));
      closeSheet(); S.sel = null; S.pages = null; await load("shops", true);
    } catch (e) { toast(e.message); b.disabled = false; draw2(); }
  };
}
async function endPro(p) {
  if (!confirm(`End Pro for "${p.title}" now?\nTheir store goes back to WhatsApp orders. Nothing is deleted.`)) return;
  try { await api({ action: "hq-end-pro", id: p.id }); toast("Pro ended for " + (p.title || "this shop")); closeSheet(); S.pages = null; await load("shops", true); } catch (e) { toast(e.message); }
}
function pageSheet(id) {

  <div class="box"><h4>Owner</h4><b>${esc(p.owner.name)}</b><div style="color:var(--mu);font-size:14px">${esc(p.owner.email)}${ph ? " · " + esc(ph) : ""}</div>
  <div class="acts">${ph ? `<a class="bt sm" href="${wa(ph)}?text=${msg}" target="_blank" rel="noopener">WhatsApp</a><a class="bt sm gh" href="${tel(ph)}">Call</a>` : ""}${p.owner.email ? `<a class="bt sm gh" href="mailto:${esc(p.owner.email)}">Email</a>` : ""}</div>${!ph ? `<small style="color:var(--mu)">No phone saved. Use email.</small>` : ""}</div>

  ${p.kind === "biz" && p.live ? `<div class="box"><h4>Keepsake Pro</h4><p style="color:var(--mu);font-size:14px;margin:0 0 10px">${p.proUntil > Date.now() ? `On until <b style="color:var(--tx)">${esc(new Date(p.proUntil).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }))}</b>.` : "Not on Pro."}${(p.proGifts || []).length ? " Last given: " + esc((p.proGifts[p.proGifts.length - 1].days ? p.proGifts[p.proGifts.length - 1].days + " days" : "ended") + (p.proGifts[p.proGifts.length - 1].note ? " · " + p.proGifts[p.proGifts.length - 1].note : "")) + "." : ""}</p>
    <div class="acts"><button class="bt sm" id="pgGive">Give Pro free</button>${p.proUntil > Date.now() ? `<button class="bt sm gh" id="pgEnd">End Pro now</button>` : ""}</div></div>` : ""}
  ${p.kind === "biz" ? `<div class="box"><h4>Keepsake Pro · paid in cash</h4>
    <p style="color:var(--mu);font-size:14px;margin:0 0 10px">${p.proUntil > Date.now() ? `<b style="color:var(--gd)">Pro is on</b> until ${esc(new Date(p.proUntil).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }))}. Online store included.` : p.proUntil ? "Pro has ended. The store is in catalogue mode (WhatsApp orders)." : "No Pro yet."} Took the payment in person? Start Pro here.${p.live ? "" : " This page isn't live yet, so it goes live too (+₹1,000)."}</p>
    <div class="seg" role="radiogroup" aria-label="Plan" style="display:flex;gap:8px;margin-bottom:10px"><button type="button" class="bt sm" data-cp="pro" aria-pressed="true">Monthly</button><button type="button" class="bt sm gh" data-cp="proYear" aria-pressed="false">Yearly</button></div>
    <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Cash received (₹)</label><input id="cashAmt" type="number" inputmode="numeric" min="0" value="${p.live ? 299 : 1299}" class="in" style="margin-bottom:10px">
    <input id="cashNote" maxlength="120" placeholder="Note (optional): who collected it" class="in">
    <button class="bt w" id="cashGo" data-id="${esc(p.id)}" data-plan="pro">Start Pro · monthly</button></div>` : ""}
  ${p.live ? `<a class="bt w" href="${esc(p.path)}" target="_blank" rel="noopener">Open page ↗</a>` : ""}`);
  const pgG = document.getElementById("pgGive"); if (pgG) pgG.onclick = () => giveSheet([p.id]);
  const pgE = document.getElementById("pgEnd"); if (pgE) pgE.onclick = () => endPro(p);
  const cg = document.getElementById("cashGo");
  document.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => {
    const yr = b.dataset.cp === "proYear";
    document.querySelectorAll("[data-cp]").forEach(x => { const on = x === b; x.setAttribute("aria-pressed", on); x.classList.toggle("gh", !on); });
    cg.dataset.plan = b.dataset.cp; cg.textContent = "Start Pro · " + (yr ? "yearly" : "monthly");
    document.getElementById("cashAmt").value = (yr ? 2999 : 299) + (p.live ? 0 : 1000);
  });
  if (cg) cg.onclick = async () => {
    const amt = Math.round(+document.getElementById("cashAmt").value);
    if (!(amt >= 0)) { toast("Enter the amount received"); return; }
    const yr = cg.dataset.plan === "proYear", lbl = cg.textContent;
    if (!confirm(`Start Keepsake Pro (${yr ? "1 year" : "30 days"}) for "${p.title}"?\nCash received: ₹${amt.toLocaleString("en-IN")}`)) return;
    cg.disabled = true; cg.textContent = "Starting…";
    try { await api({ action: "hq-cash", id: cg.dataset.id, plan: cg.dataset.plan, amount: amt, note: document.getElementById("cashNote").value }); toast("Pro started · ₹" + amt.toLocaleString("en-IN") + " cash recorded"); closeSheet(); S.orders = null; S.sum = null; await load("shops", true); }
    catch (e) { toast(e.message); cg.disabled = false; cg.textContent = lbl; }
  };
}

async function currentSub() { if (!pushOK()) return null; const r = await navigator.serviceWorker.getRegistration("/hq"); return r ? r.pushManager.getSubscription() : null; }
async function alertState() {
  const card = $("#alertCard"), btn = $("#alertBtn"), txt = $("#alertTxt");
  let sub = null; try { sub = await currentSub(); } catch (e) {}
  const on = !!sub && Notification.permission === "granted";
  if (card) card.hidden = on || !pushOK() || Notification.permission === "denied";
  if (btn && btn.classList.contains("sw")) btn.classList.toggle("on", on);
  if (txt) txt.textContent = !pushOK() ? (/iPhone|iPad/.test(navigator.userAgent) ? "Install the app to your home screen first, then turn this on." : "This browser can't show alerts.") : Notification.permission === "denied" ? "Blocked. Allow notifications for this site in your phone settings." : on ? "On: you'll get a notification for every paid order." : "Off";
}
const u8 = b => { const p = "=".repeat((4 - b.length % 4) % 4), r = atob((b + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
async function toggleAlerts() {
  if (!pushOK()) { toast(/iPhone|iPad/.test(navigator.userAgent) ? "Add HQ to your home screen first, then open it from there." : "This browser can't show alerts."); return; }
  try {
    const old = await currentSub();
    if (old && Notification.permission === "granted") { await api({ action: "push-unsub", endpoint: old.endpoint }); await old.unsubscribe(); toast("Alerts off on this phone"); }
    else {
      const p = await Notification.requestPermission(); if (p !== "granted") { toast("Notifications weren't allowed."); alertState(); return; }
      await keepKeyForAlerts();
      const reg = await navigator.serviceWorker.register("/hq-sw.js", { scope: "/hq" }); await navigator.serviceWorker.ready;
      const { key } = await api({ action: "push-key" });
      const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(key) });
      await api({ action: "push-sub", sub: sub.toJSON(), label: (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "phone" });
      toast("Alerts on ✓ You'll be notified for every order"); if (S.sum) S.sum.alerts++;
    }
  } catch (e) { toast(e.message || "Couldn't turn on alerts."); }
  alertState(); if (S.tab === "more") draw();
}

// ---------- sheet ----------
function sheet(html) { $("#sh").innerHTML = '<div class="gr"></div>' + html; $("#sh").classList.add("on"); $("#ov").classList.add("on"); $("#sh").scrollTop = 0; }
function closeSheet() { $("#sh").classList.remove("on"); $("#ov").classList.remove("on"); }
$("#ov").onclick = closeSheet;
let y0 = null; $("#sh").addEventListener("touchstart", e => { y0 = $("#sh").scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
$("#sh").addEventListener("touchend", e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 90) closeSheet(); y0 = null; });

// ---------- boot ----------
(async () => {
  if (!KEY) { $("#login").hidden = false; return; }
  try { S.sum = await api({ action: "hq-summary" }); keepKeyForAlerts(); try { sessionStorage.ak = KEY; } catch (e) {} start(); } catch (e) { $("#login").hidden = false; $("#lerr").textContent = e.message; }
})();
})();
