<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My shops · GetKeepsake for Business</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0B14">
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
<link rel="manifest" href="/dash.webmanifest"><link rel="apple-touch-icon" href="/assets/brand/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#F2F2EE;--card:#fff;--line:#DADAD3;--ink:#0B0B14;--mu:#5B5B69;--bl:#1F1BF2;--li:#D4FF3F;--gr:#1f9d55;--grl:#c9efd6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px calc(14px);padding-top:calc(14px + env(safe-area-inset-top));background:var(--ink);color:#fff}
.lg{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}.lg svg{width:26px;height:26px}
.lg b{font:800 18px 'Inter Tight',sans-serif;letter-spacing:-.02em}.lg small{display:block;font:600 9.5px 'JetBrains Mono',monospace;letter-spacing:.14em;color:var(--li)}
.who{display:flex;align-items:center;gap:10px}.who span{font-size:13.5px;color:#ffffffb3;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk{background:none;border:0;padding:0;color:#ffffffc0;font:600 13.5px Inter;text-decoration:underline;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font:800 clamp(34px,5vw,48px)/1 'Inter Tight',sans-serif;letter-spacing:-.035em}
.top p{margin:8px 0 0;color:var(--mu)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--bl);color:#fff;font:700 15px Inter;text-decoration:none;cursor:pointer;touch-action:manipulation}
.btn.k{background:var(--ink)}.btn.g{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn svg{width:18px;height:18px}
.btn:focus-visible,.lnk:focus-visible,a:focus-visible{outline:3px solid var(--li);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.sh{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px}
.sh header{display:flex;gap:14px;align-items:center}
.av{flex:none;width:54px;height:54px;border-radius:16px;background:var(--ink) center/cover no-repeat;color:#fff;display:grid;place-items:center;font:800 22px 'Inter Tight',sans-serif}
.sh h2{margin:0;font:800 20px/1.15 'Inter Tight',sans-serif;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh header div{min-width:0;flex:1}
.sh header small{display:block;color:var(--mu);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl{display:inline-block;padding:3px 10px;border-radius:999px;font:700 11.5px Inter;margin-right:6px;vertical-align:1px}
.pl.on{background:var(--grl);color:#0d5a2f}.pl.off{background:#fff0d6;color:#8a5300}.pl.pro{background:var(--ink);color:var(--li)}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kp div{padding:10px 12px;border-radius:14px;background:#F6F6F2;min-width:0}
.kp span{display:block;font-size:12px;font-weight:600;color:var(--mu)}
.kp b{display:block;margin-top:2px;font:800 22px/1.1 'Inter Tight',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp .y{background:var(--li)}.kp .y span{color:var(--ink)}
.kp .sk b{color:transparent;background:#E6E6E0;border-radius:6px}
.wk{display:flex;align-items:flex-end;gap:5px;height:44px}
.wk i{flex:1;border-radius:4px;background:#E6E6E0;min-height:4px}.wk i.v{background:var(--bl)}
.wkl{display:flex;justify-content:space-between;margin-top:6px;font:600 11px 'JetBrains Mono',monospace;color:var(--mu)}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px}.act .btn:first-child{grid-column:1/-1}
.act .btn{min-height:44px;padding:0 14px;font-size:14px}
.note{margin:0;font-size:13px;color:var(--mu)}
.new{border:2px dashed var(--line);background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;min-height:260px;text-decoration:none;color:var(--ink)}
.new i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff}.new i svg{width:24px;height:24px}
.new b{font:800 18px 'Inter Tight',sans-serif}.new small{color:var(--mu);max-width:240px}
.gift{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:22px;padding:16px 20px;border-radius:20px;background:#3b0710;color:#f5e6c8;text-decoration:none}
.gift b{display:block;font:600 16px Inter}.gift small{color:#e9cfa0b0}.gift svg{width:20px;height:20px;flex:none}
.msg{padding:60px 20px;text-align:center;color:var(--mu)}.msg b{display:block;color:var(--ink);font:800 22px 'Inter Tight',sans-serif;margin-bottom:6px}
.skc{height:300px;border-radius:24px;background:linear-gradient(90deg,#E9E8E2,#F4F3EF,#E9E8E2);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:560px){
  .wrap{padding:22px 16px 48px}.grid{grid-template-columns:1fr}
  .top .btn{width:100%}
  .who span{display:none}
}
@media (prefers-reduced-motion:reduce){.skc{animation:none}}
</style>
</head>
<body>
<header class="bar"><a class="lg" href="/shops" aria-label="GetKeepsake for Business home"><svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M5 15V9a4 4 0 0 1 4-4h6"/><path d="M33 5h6a4 4 0 0 1 4 4v6"/><path d="M43 33v6a4 4 0 0 1-4 4h-6"/><path d="M15 43H9a4 4 0 0 1-4-4v-6"/></g><rect x="11" y="22" width="26" height="4" rx="2" fill="#D4FF3F"/></svg><span><b>GetKeepsake</b><small>FOR BUSINESS</small></span></a>
  <div class="who"><span id="who"></span><button type="button" class="lnk" id="out">Log out</button></div></header>
<main class="wrap">
  <div class="top"><div><h1>My shops</h1><p id="sub">Loading your shops…</p></div><a class="btn" href="/shops/studio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New shop page</a></div>
  <section class="grid" id="list" aria-live="polite"><div class="skc"></div><div class="skc"></div></section>
  <div id="gift"></div>
</main>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = n => "₹" + Math.round(+n || 0).toLocaleString("en-IN");
const DOW = ["S", "M", "T", "W", "T", "F", "S"];
const api = async (u, o) => { const r = await fetch(u, Object.assign({ cache: "no-store" }, o || {})); const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(j.error || "Something went wrong."), { status: r.status }); return j; };
const post = b => api("/api/qr", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) });
const I = { dash: '<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 4v3h6V4z"/>', edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>', eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>', go: '<path d="M7 17 17 7M8 7h9v9"/>' };
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

function card(p) {
  const st = p.stats || {}, days = (st.days || []).slice(-7), mx = Math.max(1, ...days.map(d => d.v || 0));
  const live = p.active;
  return `<article class="sh" data-id="${esc(p.id)}">
    <header><span class="av" style="${p.logo ? `background-image:url('${esc(p.logo)}')` : ""}">${p.logo ? "" : esc((p.title || "?").trim().charAt(0).toUpperCase())}</span>
      <div><h2>${esc(p.title || "My shop")}</h2><small><span class="pl ${live ? "on" : "off"}">${live ? "Live" : "Not live yet"}</span>${esc(p.area || "getkeepsake.in/b/" + p.id)}</small></div></header>
    ${live ? `<div class="kp" data-today><div class="y sk"><span>Sales today</span><b>₹0</b></div><div class="sk"><span>Orders today</span><b>0</b></div><div><span>Scans today</span><b>${st.today || 0}</b></div></div>
    <div><div class="wk" aria-label="Page scans, last 7 days">${days.map(d => `<i class="${d.v ? "v" : ""}" style="height:${Math.max(8, Math.round((d.v || 0) * 100 / mx))}%" title="${esc(d.d)}: ${d.v || 0}"></i>`).join("")}</div>
      <div class="wkl">${days.map(d => `<span>${DOW[new Date(d.d + "T12:00:00").getDay()]}</span>`).join("")}</div></div>
    <p class="note">${st.week || 0} page scan${st.week === 1 ? "" : "s"} this week${p.ship ? " · " + esc(String(p.ship).split("|")[0] === "shipped" ? "Printed QR shipped" : "Printed QR being prepared") : ""}</p>`
    : `<p class="note">Your page is saved. Activate it so customers can open it and your QR board can be printed.</p>`}
    <div class="act">${live ? `<a class="btn k" href="/shops/dashboard?id=${esc(p.id)}">${ic("dash")}Open dashboard</a>` : `<a class="btn" href="/shops/studio?edit=${esc(p.id)}#publish">${ic("go")}Go live</a>`}
      <a class="btn g" href="/shops/studio?edit=${esc(p.id)}">${ic("edit")}Edit</a><a class="btn g" href="/b/${esc(p.id)}" target="_blank" rel="noopener">${ic("eye")}View</a></div>
  </article>`;
}

(async () => {
  let a; try { a = await api("/api/customer-auth"); } catch (e) { a = {}; }
  if (!a.user) { location.replace("/shops/login?next=/shops/my"); return; }
  $("#who").textContent = a.user.email || a.user.name || "";
  let L; try { L = await api("/api/customer-memories"); } catch (e) { $("#list").innerHTML = `<div class="msg" style="grid-column:1/-1"><b>Couldn't load your shops</b>${esc(e.message)}<br><br><button class="btn" onclick="location.reload()">Try again</button></div>`; return; }
  const all = L.memories || [], shops = all.filter(m => m.kind === "biz"), gifts = all.length - shops.length;
  $("#sub").textContent = shops.length ? `${shops.length} shop page${shops.length === 1 ? "" : "s"} · pick one to run it` : "You don't have a shop page yet.";
  $("#list").innerHTML = shops.map(card).join("") + `<a class="sh new" href="/shops/studio"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></i><b>${shops.length ? "Add another shop" : "Create your shop page"}</b><small>Menu, WhatsApp orders, UPI and a QR for your counter. Ready in minutes.</small></a>`;
  if (gifts) $("#gift").innerHTML = `<a class="gift" href="/dashboard?all=1"><span><b>My gift memories (${gifts})</b><small>Memory cards and gift websites</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></a>`;
  // Today's orders and sales for each live shop, all at once.
  await Promise.all(shops.filter(s => s.active).map(async s => {
    const el = document.querySelector(`[data-id="${s.id}"] [data-today]`); if (!el) return;
    try { const t = await post({ action: "bz-own-today", id: s.id }); const [sa, or] = el.children;
      sa.classList.remove("sk"); sa.querySelector("b").textContent = inr(t.sales || 0);
      or.classList.remove("sk"); or.querySelector("b").textContent = (t.orders || 0) + (t.waiting ? ` · ${t.waiting} new` : "");
    } catch (e) { [...el.children].forEach(x => x.classList.remove("sk")); }
  }));
})();
$("#out").onclick = async () => { try { Object.keys(localStorage).filter(k => k.startsWith("gk-dash-c:")).forEach(k => localStorage.removeItem(k)); } catch (e) {} try { await api("/api/customer-auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "logout" }) }); } catch (e) {} location.href = "/shops"; };
})();
</script>
</body>
</html>
