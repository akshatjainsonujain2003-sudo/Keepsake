<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop dashboard · GetKeepsake for business</title>
<meta name="description" content="Run your shop from one place: orders, menu, customers, offers and stats.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121110">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Pinyon+Script&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f3f0e9;--card:#fbfaf6;--line:#e5dfd3;--ink:#121110;--mu:#6d675e;--or:#ff5b2e;--ye:#ffd84d;--gr:#1f9d55;--grl:#c9efd6;--sand:#e4ddd0;--side:#121110;--r:22px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.H{font-family:'Archivo Black','Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em}
[hidden]{display:none!important}
/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);color:#fff;padding:26px 16px 18px;display:flex;flex-direction:column}
.lg{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;text-decoration:none;color:#fff;padding:0 10px 0 12px;font:400 19px/1 'Archivo Black',sans-serif;letter-spacing:-.01em}
.lg span{font:400 25px/1 'Pinyon Script',cursive;color:var(--ye);letter-spacing:0}
.nav{margin-top:26px;flex:1}
.nav small{display:block;margin:20px 0 6px 14px;font:800 10.5px Inter;letter-spacing:.2em;color:#ffffff80;text-transform:uppercase}
.nav small:first-child{margin-top:0}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;text-decoration:none;color:#ffffffde;font-weight:500}
.nav a svg{width:19px;height:19px;flex:none;opacity:.8}
.nav a:hover{background:#ffffff12}
.nav a.on{background:var(--or);color:#fff}.nav a.on svg{opacity:1}
.nav a em{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--ye);color:var(--ink);font:800 12px/22px Inter;font-style:normal;text-align:center}
.shopc{display:flex;gap:11px;align-items:center;margin-top:18px;padding:13px;border-radius:16px;background:#ffffff12;text-decoration:none;color:#fff}
.shopc i{width:38px;height:38px;flex:none;border-radius:11px;background:#7a1622 center/cover;display:grid;place-items:center;font:800 16px Inter;font-style:normal;color:var(--ye)}
.shopc b{display:block;font-size:14.5px;line-height:1.2}.shopc small{display:block;color:#ffffff99;font-size:12px;word-break:break-all;margin-top:2px}
.shopc select{margin-top:8px;width:100%;background:#ffffff1a;border:0;border-radius:9px;padding:6px 8px;color:#fff;font-size:12.5px}
.shopc select option{color:#111}
main{min-width:0;padding:30px 34px 60px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.top h1{margin:0;font-size:clamp(28px,2.7vw,40px);line-height:1.02}
.top p{margin:8px 0 0;color:var(--mu)}
.tg{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 9px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:500;white-space:nowrap;user-select:none}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{position:relative;width:42px;height:24px;border-radius:99px;background:#cfc8bb;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.sw input:checked+i{background:var(--gr)}.sw input:checked+i::after{left:21px}
.sw input:focus-visible+i{outline:2px solid var(--or);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:99px;border:0;background:var(--or);color:#fff;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn.k{background:var(--ink)}.btn.g{background:none;border:1.5px solid var(--ink);color:var(--ink);padding:10px 16px}.btn.w{background:#25d366;color:#053019}
.btn.s{padding:8px 13px;font-size:13.5px}.btn.g.s{padding:7px 12px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:17px;height:17px}
/* ---------- cards ---------- */
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}
.kpi{padding:22px 24px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);min-width:0}
.kpi span{display:block;font-weight:600;font-size:14px}
.kpi b{display:block;margin:6px 0 6px;font:400 clamp(30px,3.1vw,42px)/1 'Archivo Black',sans-serif;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;font-weight:700;font-size:13.5px}
.kpi.o{background:var(--or);border-color:var(--or);color:#fff}
.kpi.y{background:var(--ye);border-color:var(--ye)}
.kpi.k{background:var(--ink);border-color:var(--ink);color:#fff}.kpi.k small{color:var(--ye)}
.kpi .up{color:inherit}.kpi:not(.o) .gd{color:var(--gr)}
.cd{padding:22px 24px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ch h2{margin:0;font-size:17px}
.ch small{color:var(--mu);font-size:13.5px}
.mu{color:var(--mu)}
.empty{padding:26px 18px;border-radius:16px;background:#f0ebe1;color:var(--mu);text-align:center;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:12px}
/* bars */
.bars{display:flex;gap:12px;align-items:flex-end;height:230px}
.bars>div{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:7px}
.bars u{display:block;border-radius:10px;background:var(--sand);min-height:8px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bars .hi u{background:var(--or)}
.bars b,.bars small{display:block;padding:2px 8px;border-radius:7px;background:var(--sand);font-size:12px;font-weight:600;color:#4a453e;white-space:nowrap;overflow:hidden}
.bars small{font-weight:500}
.bars .hi b,.bars .hi small{background:var(--or);color:#fff}
.bars.sm{height:150px;gap:5px}.bars.sm u{border-radius:6px}.bars.sm b{display:none}.bars.sm small{padding:2px 0;background:none;text-align:center;overflow:visible}.bars.sm .hi small{background:none;color:var(--or);font-weight:700}
/* orders list */
.ol{list-style:none;margin:0;padding:0}
.ol li{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1.5px solid var(--line)}
.av{width:42px;height:42px;flex:none;border-radius:50%;background:var(--ye);display:grid;place-items:center;font:800 14px Inter}
.ol .nm{flex:1;min-width:0}.ol .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ol .nm small{color:var(--mu)}
.ol .am{text-align:right;flex:none}.ol .am b{display:block;font-weight:700}
.pl{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:99px;font:700 12px Inter;background:var(--sand);color:var(--ink);white-space:nowrap}
.pl.new{background:var(--or);color:#fff}.pl.prep{background:var(--ye)}.pl.ready{background:var(--grl);color:#0d5a2f}.pl.done{background:#e6e1d7;color:#5d574e}.pl.cancel{background:#f6d9d3;color:#9b2c16}
/* rows (top items, checklist) */
.rows>div{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1.5px solid var(--line)}
.rows>div>span{flex:1;min-width:0}.rows>div>span.av{flex:none}.rows b{display:block}.rows small{color:var(--mu)}
.ck{width:26px;height:26px;flex:none;border-radius:50%;background:var(--sand);display:grid;place-items:center;color:#fff}
.ck.on{background:var(--gr)}.ck svg{width:15px;height:15px}
.rows a.go{font-size:13px;font-weight:700;color:var(--or);text-decoration:none;white-space:nowrap}
/* offer */
.ofr{padding:18px 18px 20px;border-radius:18px;background:var(--or);color:#fff}
.ofr small{display:block;font-size:12.5px;opacity:.9}
.ofr b{display:block;margin-top:6px;font:400 22px/1.1 'Archivo Black',sans-serif;text-transform:uppercase}
.ofr p{margin:8px 0 0;font-weight:600}
.ofr.off{background:#e9e3d8;color:var(--mu)}
.wide{width:100%;margin-top:12px;justify-content:flex-start}
/* forms */
.f{display:block;margin:0 0 14px;font-weight:600;font-size:13.5px}
.f em{font-style:normal;font-weight:500;color:var(--mu)}
.in{display:block;width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:500;font-size:15px}
.in:focus{outline:0;border-color:var(--or)}
textarea.in{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{padding:12px 14px;border-radius:12px;background:#fff6d6;border:1.5px solid #f3df92;font-size:13.5px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-radius:16px;background:var(--ink);color:#fff;margin-bottom:18px}
.bar span{flex:1;min-width:200px}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{padding:9px 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs button em{font-style:normal;margin-left:6px;padding:0 7px;border-radius:99px;background:var(--or);color:#fff;font-size:12px}
/* order cards */
.oc{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.oc>article{display:flex;flex-direction:column;padding:18px;border-radius:20px;background:var(--card);border:1.5px solid var(--line)}
.oc>article.new{border-color:var(--or);box-shadow:0 0 0 3px #ff5b2e22}
.oc header{display:flex;gap:12px;align-items:center}
.oc header div{flex:1;min-width:0}.oc header b{display:block}.oc header small{color:var(--mu)}
.oc ul{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1.5px dashed var(--line)}
.oc ul li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.oc .tot{display:flex;justify-content:space-between;margin-top:8px;padding-top:10px;border-top:1.5px solid var(--line);font-weight:800}
.oc .meta{margin-top:10px;font-size:13.5px;color:#3d3832;display:grid;gap:3px}
.oc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:2px}
.oc .acts .btn{flex:1}
.lnk{background:none;border:0;padding:0;color:var(--mu);text-decoration:underline;font-size:13px}
/* tables */
.tw{overflow:auto;border-radius:16px;border:1.5px solid var(--line);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:700 12px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:12px 14px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1.5px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .btn{white-space:nowrap}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--ye);font:700 11.5px Inter;margin:2px 4px 2px 0;white-space:nowrap}
.tag.g{background:var(--grl);color:#0d5a2f}.tag.s{background:var(--sand)}
.srch{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.srch .in{margin:0;flex:1;min-width:200px}
/* menu editor */
.ms{margin-bottom:18px}
.ms h3{margin:0 0 10px;font-size:15px}
.mi{display:grid;grid-template-columns:52px minmax(0,1fr) 120px auto;gap:12px;align-items:center;padding:10px 0;border-top:1.5px solid var(--line)}
.mi .ph{width:52px;height:52px;border-radius:12px;background:var(--sand) center/cover;display:grid;place-items:center;color:var(--mu);font-size:11px}
.mi b{display:block;overflow:hidden;text-overflow:ellipsis}.mi small{color:var(--mu)}
.mi .in{margin:0;padding:9px 11px;font-size:14.5px}
.mi .tw2{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{padding:7px 11px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:12.5px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.chip.so.on{background:#9b2c16;border-color:#9b2c16}
.mi.isso b{text-decoration:line-through;color:var(--mu)}
.bub{position:relative;max-width:420px;padding:12px 14px 14px;border-radius:4px 16px 16px 16px;background:#dcf8c6;color:#111;white-space:pre-wrap;font-size:14.5px;line-height:1.45;box-shadow:0 1px 1px #0002;word-break:break-word}
.nx{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:6px;border-radius:16px;background:#e9f9ef;border:1.5px solid #bfe8cd}
.rows>div.dn{opacity:.6}
.dock{position:sticky;bottom:16px;z-index:5;display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 12px 12px 20px;border-radius:99px;background:var(--ink);color:#fff;box-shadow:0 16px 36px -14px #000a}
.dock span{flex:1}
/* misc */
.funnel{display:grid;gap:10px}
.funnel div{display:grid;grid-template-columns:150px 1fr 60px;gap:12px;align-items:center;font-size:14px}
.funnel i{display:block;height:28px;border-radius:8px;background:var(--or);min-width:4px}
.funnel div:nth-child(2) i{background:#ff8a5c}.funnel div:nth-child(3) i{background:var(--ye)}
.funnel b{text-align:right}
.qrb{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.qrb .qbox{width:200px;height:200px;padding:12px;border-radius:18px;background:#fff;border:1.5px solid var(--line)}
.qrb .qbox svg{width:100%;height:100%}
.tones{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tones button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.tones button.on{box-shadow:0 0 0 2.5px var(--ink)}
.stamp{transform-origin:top left}
.frame{width:300px;height:600px;border-radius:40px;background:#111;padding:10px;flex:none;box-shadow:0 30px 60px -30px #0008}
.frame iframe{width:100%;height:100%;border:0;border-radius:31px;background:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14.5px}.kv dt{color:var(--mu)}.kv dd{margin:0;font-weight:600;word-break:break-word}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;padding:12px 18px;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;transition:.25s;z-index:99;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.load{display:grid;place-items:center;min-height:60vh;color:var(--mu)}
.sk{border-radius:var(--r);background:linear-gradient(90deg,#ebe6dc,#f4f0e8,#ebe6dc);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.hint{font-size:13px;color:var(--mu);margin:10px 0 0}
.tabbar{display:none}
.more{position:fixed;inset:0;z-index:40;background:#0007;display:flex;align-items:flex-end}
.pm{position:fixed;inset:0;z-index:45;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px}
.pmb{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:24px;padding:22px}
.pmp{flex:none;width:96px;height:96px;border-radius:16px;border:2px dashed var(--line);background:#f0ebe1 center/cover;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--mu);cursor:pointer}.pmp.busy{opacity:.6}
@media (max-width:600px){.pm{align-items:flex-end;padding:0}.pmb{border-radius:24px 24px 0 0}}
.more>div{width:100%;max-height:85vh;overflow:auto;background:var(--side);border-radius:24px 24px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}.g3>:last-child{grid-column:1/-1}}
@media (max-width:900px){
  .app{display:block}.side{display:none}
  main{padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
  .g2,.g3{grid-template-columns:1fr}.g3>:last-child{grid-column:auto}
  .g4{gap:12px}.kpi{padding:16px}.kpi b{font-size:28px}.kpi small{font-size:12.5px}
  .top h1{font-size:28px}.top .tg{width:100%}.top .tg .btn{flex:1}
  .bars{height:180px;gap:7px}.bars b,.bars small{padding:2px 4px;font-size:11px;text-align:center}
  .cd{padding:18px}
  .mi{grid-template-columns:44px minmax(0,1fr) 92px}.mi .ph{width:44px;height:44px}.mi .tw2{grid-column:2/-1;justify-content:flex-start}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--side);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:0;background:none;color:#ffffffb0;text-decoration:none;font-size:11px;font-weight:600;position:relative}
  .tabbar svg{width:22px;height:22px}
  .tabbar .on{color:var(--or)}
  .tabbar em{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:99px;background:var(--ye);color:var(--ink);font:800 11px/18px Inter;font-style:normal;padding:0 5px}
  .funnel div{grid-template-columns:110px 1fr 46px}
  .tw{border:0;background:none;overflow:visible}.tw table,.tw tbody,.tw tr,.tw td{display:block}.tw thead{display:none}
  .tw tr{position:relative;margin-bottom:10px;padding:14px 16px;border-radius:16px;background:var(--card);border:1.5px solid var(--line)}
  .tw td{padding:2px 0;border:0;font-size:14px}.tw td[data-l]::before{content:attr(data-l) ": ";color:var(--mu)}
  .tw td:last-child{position:absolute;right:14px;top:14px;display:flex;gap:6px;align-items:center}
  .frame{width:260px;height:520px}
  .row2{grid-template-columns:1fr}
}
@media (max-width:420px){.g4{grid-template-columns:1fr 1fr}.kpi b{font-size:24px}.sw{padding:7px 12px 7px 8px;font-size:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<script src="/assets/qr-cards.v5.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Dashboard menu">
    <a class="lg" href="/shops">GetKeepsake<span>for business</span></a>
    <nav class="nav" id="nav"></nav>
    <div class="shopc" id="shopc"></div>
  </aside>
  <main id="main"><div class="load">Loading your shop…</div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Dashboard"></nav>
<div class="more" id="more" hidden><div id="moreIn"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = n => "₹" + Math.round(+n || 0).toLocaleString("en-IN");
const num = p => { const x = /(\d[\d,]*(?:\.\d+)?)/.exec(String(p || "").replace(/\s/g, "")); return x ? +x[1].replace(/,/g, "") : null; };
const dayKey = t => { const d = new Date(t); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };

async function api(url, opt) {
  const r = await fetch(url, Object.assign({ cache: "no-store" }, opt || {}));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again.");
  return j;
}
const post = (body) => api("/api/qr", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

// Save a change to the page: fetch the latest copy first so edits made in the studio aren't lost.
async function patch(fn, okMsg) {
  try {
    const j = await api("/api/customer-memories?id=" + S.id);
    const d = j.data; fn(d);
    await api("/api/customer-memories", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: S.id, data: d }) });
    S.d = d; if (okMsg) toast(okMsg); return true;
  } catch (e) { toast(e.message); return false; }
}

// ---------- derived numbers ----------
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return +d; };
const live = o => o.st !== "cancel";
function ordersOn(t0, t1) { return S.orders.filter(o => o.at >= t0 && o.at < t1 && live(o)); }
function sum(os) { return os.reduce((t, o) => t + o.tot, 0); }
function topItems(os, n) {
  const m = {}; os.forEach(o => o.items.forEach(x => { const k = x.n; m[k] = m[k] || { n: x.n, q: 0, v: 0 }; m[k].q += x.q; m[k].v += x.q * x.p; }));
  return Object.values(m).sort((a, b) => b.q - a.q || b.v - a.v).slice(0, n);
}
const waiting = () => S.orders.filter(o => o.st === "new" || o.st === "prep").length;
const newCount = () => S.orders.filter(o => o.st === "new").length;
function menuItems() { const out = []; (S.d.menu || []).forEach((s, si) => (s.items || []).forEach((x, ii) => { if (x && x.n) out.push({ ...x, si, ii, sec: s.n }); })); return out; }
const pageUrl = () => location.origin + "/b/" + S.id;
const shopName = () => (S.d && S.d.t) || "Your shop";

}

function inactive() { return S.active ? "" : `<div class="bar"><span><b>Your page isn't live yet.</b> Customers can't open it until it's activated.</span><a class="btn" href="/shops/studio?edit=${S.id}#publish">Activate my page</a></div>`; }
function bars(days, cls) {
  const mx = Math.max(1, ...days.map(x => x.v)), best = days.reduce((b, x, i) => x.v > days[b].v ? i : b, 0);
  return `<div class="bars ${cls || ""}">${days.map((x, i) => `<div class="${x.v && i === best ? "hi" : ""}" title="${esc(x.t)}: ${esc(x.lab || x.v)}"><u style="height:${Math.max(4, Math.round(x.v * 100 / mx))}%"></u><b>${esc(x.lab != null ? x.lab : x.v)}</b><small>${esc(x.l)}</small></div>`).join("")}</div>`;
}
function scanDays() { return (S.stats && S.stats.days || []).map(x => { const d = new Date(x.d + "T12:00:00"); return { v: x.v, l: DOW[d.getDay()], t: DOWL[d.getDay()] }; }); }
function orderRow(o) {

}
function checklist() {
  const d = S.d, items = menuItems(), noPhoto = items.filter(x => !x.i).length;
  const scanned = S.stats && (S.stats.week || S.stats.prevWeek);
  const L = [
    [!!d.logo && items.length >= 3, "Add your logo and menu", d.logo ? "Add at least 3 items" : "Your logo builds trust", "/shops/studio?edit=" + S.id],

function orderCard(o) {

  return `<article class="${o.st === "new" ? "new" : ""}" data-ref="${o.ref}"><header><span class="av">${esc(ini(o.name))}</span><div><b>${esc(o.name || "Customer")}</b><small>#${o.ref} · ${ago(o.at)}</small></div><span class="pl ${o.st}">${STL[o.st]}</span></header>

let actx;

  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const t = actx.currentTime; [880, 1320].forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = "sine"; g.gain.setValueAtTime(0.0001, t + i * .18); g.gain.exponentialRampToValueAtTime(.3, t + i * .18 + .02); g.gain.exponentialRampToValueAtTime(.0001, t + i * .18 + .5); o.connect(g).connect(actx.destination); o.start(t + i * .18); o.stop(t + i * .18 + .55); }); } catch (e) {}
}
document.addEventListener("pointerdown", () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {} }, { once: true });
async function loadOrders(quiet) {

  } catch (e) { /* offline for a moment: try again next round */ }
}
function poll() { setTimeout(async () => { if (!document.hidden) await loadOrders(true); poll(); }, 20000); }

// ---------- start ----------
(async () => {
  try {
