<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop dashboard · GetKeepsake for business</title>
<meta name="description" content="Run your shop from one place: orders, menu, customers, offers and stats.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0B14">
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg"><link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/icon-192.png"><link rel="apple-touch-icon" href="/assets/brand/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="manifest" href="/dash.webmanifest">
<link rel="apple-touch-icon" href="/assets/brand/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GK Business"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#F2F2EE;--card:#FFFFFF;--line:#DADAD3;--ink:#0B0B14;--mu:#5B5B69;--or:#1F1BF2;--ye:#D4FF3F;--gr:#1f9d55;--grl:#c9efd6;--sand:#E6E6E0;--side:#0B0B14;--r:22px;--lav:#8C82FF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.H{font-family:'Inter Tight','Arial Black',sans-serif;font-weight:700;letter-spacing:-.03em}
[hidden]{display:none!important}
/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);color:#fff;padding:26px 16px 18px;display:flex;flex-direction:column}
.lg{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;text-decoration:none;color:#fff;padding:0 10px 0 12px;font:800 19px/1 'Inter Tight',sans-serif;letter-spacing:-.01em}
.lg span{font:600 11px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--ye);letter-spacing:0}
.nav{margin-top:26px;flex:1}
.nav small{display:block;margin:20px 0 6px 14px;font:800 10.5px Inter;letter-spacing:.2em;color:#ffffff80;text-transform:uppercase}
.nav small:first-child{margin-top:0}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;text-decoration:none;color:#ffffffde;font-weight:500}
.nav a svg{width:19px;height:19px;flex:none;opacity:.8}
.nav a:hover{background:#ffffff12}
.nav a.on{background:var(--or);color:#fff}.nav a.on svg{opacity:1}
.nav a em{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--ye);color:var(--ink);font:800 12px/22px Inter;font-style:normal;text-align:center}
.shopc{display:flex;gap:11px;align-items:center;margin-top:18px;padding:13px;border-radius:16px;background:#ffffff12;text-decoration:none;color:#fff}
.shopc i{width:38px;height:38px;flex:none;border-radius:11px;background:#7a1622 center/cover;display:grid;place-items:center;font:800 16px Inter;font-style:normal;color:var(--ye)}
.shopc b{display:block;font-size:14.5px;line-height:1.2}.shopc small{display:block;color:#ffffff99;font-size:12px;word-break:break-all;margin-top:2px}
.shopc select{margin-top:8px;width:100%;background:#ffffff1a;border:0;border-radius:9px;padding:6px 8px;color:#fff;font-size:12.5px}
.shopc select option{color:#111}
main{min-width:0;padding:30px 34px 60px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.top h1{margin:0;font-size:clamp(28px,2.7vw,40px);line-height:1.02}
.top p{margin:8px 0 0;color:var(--mu)}
.tg{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 9px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:500;white-space:nowrap;user-select:none}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{position:relative;width:42px;height:24px;border-radius:99px;background:#cfc8bb;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.sw input:checked+i{background:var(--gr)}.sw input:checked+i::after{left:21px}
.sw input:focus-visible+i{outline:2px solid var(--or);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:99px;border:0;background:var(--or);color:#fff;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn.k{background:var(--ink)}.btn.g{background:none;border:1.5px solid var(--ink);color:var(--ink);padding:10px 16px}.btn.w{background:#25d366;color:#053019}
.btn.s{padding:8px 13px;font-size:13.5px}.btn.g.s{padding:7px 12px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:17px;height:17px}
/* ---------- cards ---------- */
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}
.kpi{padding:22px 24px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);min-width:0}
.kpi span{display:block;font-weight:600;font-size:14px}
.kpi b{display:block;margin:6px 0 6px;font:800 clamp(30px,3.1vw,42px)/1 'Inter Tight',sans-serif;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;font-weight:700;font-size:13.5px}
.kpi.o{background:var(--or);border-color:var(--or);color:#fff}
.kpi.y{background:var(--ye);border-color:var(--ye)}
.kpi.k{background:var(--ink);border-color:var(--ink);color:#fff}.kpi.k small{color:var(--ye)}
.kpi .up{color:inherit}.kpi:not(.o) .gd{color:var(--gr)}
.cd{padding:22px 24px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ch h2{margin:0;font-size:17px}
.ch small{color:var(--mu);font-size:13.5px}
.mu{color:var(--mu)}
.empty{padding:26px 18px;border-radius:16px;background:#ECECE7;color:var(--mu);text-align:center;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:12px}
/* bars */
.bars{display:flex;gap:12px;align-items:flex-end;height:230px}
.bars>div{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:7px}
.bars u{display:block;border-radius:10px;background:var(--sand);min-height:8px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bars .hi u{background:var(--or)}
.bars b,.bars small{display:block;padding:2px 8px;border-radius:7px;background:var(--sand);font-size:12px;font-weight:600;color:#4a453e;white-space:nowrap;overflow:hidden}
.bars small{font-weight:500}
.bars .hi b,.bars .hi small{background:var(--or);color:#fff}
.bars.sm{height:150px;gap:5px}.bars.sm u{border-radius:6px}.bars.sm b{display:none}.bars.sm small{padding:2px 0;background:none;text-align:center;overflow:visible}.bars.sm .hi small{background:none;color:var(--or);font-weight:700}
/* orders list */
.ol{list-style:none;margin:0;padding:0}
.ol li{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1.5px solid var(--line)}
.av{width:42px;height:42px;flex:none;border-radius:50%;background:var(--ye);display:grid;place-items:center;font:800 14px Inter}
.ol .nm{flex:1;min-width:0}.ol .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ol .nm small{color:var(--mu)}
.ol .am{text-align:right;flex:none}.ol .am b{display:block;font-weight:700}
.pl{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:99px;font:700 12px Inter;background:var(--sand);color:var(--ink);white-space:nowrap}
.pl.new{background:var(--or);color:#fff}.pl.prep{background:var(--ye)}.pl.ready{background:var(--grl);color:#0d5a2f}.pl.done{background:#e6e1d7;color:#5d574e}.pl.cancel{background:#f6d9d3;color:#9b2c16}
/* rows (top items, checklist) */
.rows>div{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1.5px solid var(--line)}
.rows>div>span{flex:1;min-width:0}.rows>div>span.av{flex:none}.rows b{display:block}.rows small{color:var(--mu)}
.ck{width:26px;height:26px;flex:none;border-radius:50%;background:var(--sand);display:grid;place-items:center;color:#fff}
.ck.on{background:var(--gr)}.ck svg{width:15px;height:15px}
.rows a.go{font-size:13px;font-weight:700;color:var(--or);text-decoration:none;white-space:nowrap}
/* offer */
.ofr{padding:18px 18px 20px;border-radius:18px;background:var(--or);color:#fff}
.ofr small{display:block;font-size:12.5px;opacity:.9}
.ofr b{display:block;margin-top:6px;font:800 22px/1.1 'Inter Tight',sans-serif;text-transform:uppercase}
.ofr p{margin:8px 0 0;font-weight:600}
.ofr.off{background:#E6E6E0;color:var(--mu)}
.wide{width:100%;margin-top:12px;justify-content:flex-start}
/* forms */
.f{display:block;margin:0 0 14px;font-weight:600;font-size:13.5px}
.f em{font-style:normal;font-weight:500;color:var(--mu)}
.in{display:block;width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:500;font-size:15px}
.in:focus{outline:0;border-color:var(--or)}
textarea.in{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pmx{margin:4px 0 16px;border-radius:16px;border:1px solid var(--line);padding:4px 14px}.pmx>summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}.pmx>summary::-webkit-details-marker{display:none}.pmx>summary small{font-weight:500;color:var(--mu)}
.pmx[open]>summary{border-bottom:1px solid var(--line);margin-bottom:12px}
.pmg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pmg span{position:relative;width:64px;height:64px;border-radius:12px;background:#ECECE7 center/cover}.pmg span button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;border:0;background:var(--ink);color:#fff;font-size:13px;line-height:22px;cursor:pointer}
.pmg label{width:64px;height:64px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mu);cursor:pointer;text-align:center}
.pmr{display:grid;grid-template-columns:1fr 90px auto auto;gap:8px;align-items:center;margin-bottom:8px}.pmr.ad{grid-template-columns:1fr 90px auto}.pmr .in{padding:10px 12px}.pmr label{font-size:12.5px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.pmr button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer;font-size:16px}
.note{padding:12px 14px;border-radius:12px;background:#F4FFD1;border:1.5px solid #E2FF73;font-size:13.5px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-radius:16px;background:var(--ink);color:#fff;margin-bottom:18px}
.bar span{flex:1;min-width:200px}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{padding:9px 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs button em{font-style:normal;margin-left:6px;padding:0 7px;border-radius:99px;background:var(--or);color:#fff;font-size:12px}
/* order cards */
.oc{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.oc>article{display:flex;flex-direction:column;padding:18px;border-radius:20px;background:var(--card);border:1.5px solid var(--line)}
.oc>article.new{border-color:var(--or);box-shadow:0 0 0 3px #ff5b2e22}
.oc header{display:flex;gap:12px;align-items:center}
.oc header div{flex:1;min-width:0}.oc header b{display:block}.oc header small{color:var(--mu)}
.oc ul{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1.5px dashed var(--line)}
.oc ul li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.oc .tot{display:flex;justify-content:space-between;margin-top:8px;padding-top:10px;border-top:1.5px solid var(--line);font-weight:800}
.tbl{display:inline-block;background:var(--ink);color:#fff;border-radius:99px;padding:3px 12px;font:800 13px Inter}
.oc .meta{margin-top:10px;font-size:13.5px;color:#3d3832;display:grid;gap:3px}
.oc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:2px}
.oc .acts .btn{flex:1}
.lnk{background:none;border:0;padding:0;color:var(--mu);text-decoration:underline;font-size:13px}
/* tables */
.tw{overflow:auto;border-radius:16px;border:1.5px solid var(--line);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:700 12px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:12px 14px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1.5px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .btn{white-space:nowrap}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--ye);font:700 11.5px Inter;margin:2px 4px 2px 0;white-space:nowrap}
.tag.g{background:var(--grl);color:#0d5a2f}.tag.s{background:var(--sand)}
.srch{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.srch .in{margin:0;flex:1;min-width:200px}
/* menu editor */
.ms{margin-bottom:18px}
.ms h3{margin:0 0 10px;font-size:15px}
.mi{display:grid;grid-template-columns:52px minmax(0,1fr) 120px auto;gap:12px;align-items:center;padding:10px 0;border-top:1.5px solid var(--line)}
.mi .ph{width:52px;height:52px;border-radius:12px;background:var(--sand) center/cover;display:grid;place-items:center;color:var(--mu);font-size:11px}
.mi b{display:block;overflow:hidden;text-overflow:ellipsis}.mi small{color:var(--mu)}
.mi .in{margin:0;padding:9px 11px;font-size:14.5px}
.mi .tw2{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{padding:7px 11px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:12.5px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.chip.so.on{background:#9b2c16;border-color:#9b2c16}
.mi.isso b{text-decoration:line-through;color:var(--mu)}
.bub{position:relative;max-width:420px;padding:12px 14px 14px;border-radius:4px 16px 16px 16px;background:#dcf8c6;color:#111;white-space:pre-wrap;font-size:14.5px;line-height:1.45;box-shadow:0 1px 1px #0002;word-break:break-word}
.nx{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:6px;border-radius:16px;background:#e9f9ef;border:1.5px solid #bfe8cd}
.rows>div.dn{opacity:.6}
.dock{position:sticky;bottom:16px;z-index:5;display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 12px 12px 20px;border-radius:99px;background:var(--ink);color:#fff;box-shadow:0 16px 36px -14px #000a}
.dock span{flex:1}
/* misc */
.funnel{display:grid;gap:10px}
.funnel div{display:grid;grid-template-columns:150px 1fr 60px;gap:12px;align-items:center;font-size:14px}
.funnel i{display:block;height:28px;border-radius:8px;background:var(--or);min-width:4px}
.funnel div:nth-child(2) i{background:#6E62FF}.funnel div:nth-child(3) i{background:var(--ye)}
.funnel b{text-align:right}
.qrb{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.qrb .qbox{width:200px;height:200px;padding:12px;border-radius:18px;background:#fff;border:1.5px solid var(--line)}
.qrb .qbox svg{width:100%;height:100%}
.tones{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tones button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.tones button.on{box-shadow:0 0 0 2.5px var(--ink)}
.stamp{transform-origin:top left}
.frame{width:300px;height:600px;border-radius:40px;background:#111;padding:10px;flex:none;box-shadow:0 30px 60px -30px #0008}
.frame iframe{width:100%;height:100%;border:0;border-radius:31px;background:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14.5px}.kv dt{color:var(--mu)}.kv dd{margin:0;font-weight:600;word-break:break-word}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;padding:12px 18px;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;transition:.25s;z-index:99;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.load{display:grid;place-items:center;min-height:60vh;color:var(--mu)}
.sk{border-radius:var(--r);background:linear-gradient(90deg,#E6E6E0,#F2F2EE,#E6E6E0);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.hint{font-size:13px;color:var(--mu);margin:10px 0 0}
.tabbar{display:none}
.more{position:fixed;inset:0;z-index:40;background:#0007;display:flex;align-items:flex-end}
.sl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.sl>span{flex:1;min-width:0;font-weight:600;font-size:14px}.sl>span small{display:block;color:var(--mu);font-weight:500}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:18px;line-height:1}
.qty b{min-width:20px;text-align:center}
.salist{max-height:240px;overflow:auto;margin-top:8px}
.satot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;font-weight:800;font-size:18px}
.ofl{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--sand);font-size:12px;font-weight:700;margin-left:6px}
.pm{position:fixed;inset:0;z-index:45;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px}
.pmb{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:24px;padding:22px}
.pmp{flex:none;width:96px;height:96px;border-radius:16px;border:2px dashed var(--line);background:#ECECE7 center/cover;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--mu);cursor:pointer}.pmp.busy{opacity:.6}
@media (max-width:600px){.pm{align-items:flex-end;padding:0}.pmb{border-radius:24px 24px 0 0}}
.more>div{width:100%;max-height:85vh;overflow:auto;background:var(--side);border-radius:24px 24px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}.g3>:last-child{grid-column:1/-1}}
@media (max-width:900px){
  .app{display:block}.side{display:none}
  main{padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
  .g2,.g3{grid-template-columns:1fr}.g3>:last-child{grid-column:auto}
  .g4{gap:12px}.kpi{padding:16px}.kpi b{font-size:28px}.kpi small{font-size:12.5px}
  .top h1{font-size:28px}.top .tg{width:100%}.top .tg .btn{flex:1}
  .bars{height:180px;gap:7px}.bars b,.bars small{padding:2px 4px;font-size:11px;text-align:center}
  .cd{padding:18px}
  .mi{grid-template-columns:44px minmax(0,1fr) 92px}.mi .ph{width:44px;height:44px}.mi .tw2{grid-column:2/-1;justify-content:flex-start}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--side);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:0;background:none;color:#ffffffb0;text-decoration:none;font-size:11px;font-weight:600;position:relative}

// A print-ready PNG: a title, the QR, and a line under it.
function cpPng(url, top, title, foot, file) {
  if (!window.qrcode) { toast("QR is still loading. Try again in a second."); return; }
  const q = qrcode(0, "M"); q.addData(url); q.make();
  const n = q.getModuleCount(), W = 1200, s = Math.floor(860 / (n + 8)), qs = s * (n + 8), H = 1560, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, W, H); x.textAlign = "center"; x.fillStyle = "#0B0B14";
  x.font = "800 64px 'Inter Tight', 'Arial Black', sans-serif"; x.fillText(top, W / 2, 150);
  x.font = "700 52px Inter, Arial, sans-serif"; const words = String(title).split(" "), lines = [""]; words.forEach(w => { const t = (lines[lines.length - 1] + " " + w).trim(); if (x.measureText(t).width > W - 160 && lines[lines.length - 1]) lines.push(w); else lines[lines.length - 1] = t; }); lines.slice(0, 2).forEach((l, i) => x.fillText(l, W / 2, 240 + i * 64));
  const ox = (W - qs) / 2, oy = 360; for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect(ox + (k + 4) * s, oy + (r + 4) * s, s, s);
  x.font = "600 40px Inter, Arial, sans-serif"; x.fillText(foot, W / 2, oy + qs + 80); x.fillStyle = "#8a8279"; x.font = "500 30px Inter, Arial, sans-serif"; x.fillText(url.replace(/^https?:\/\//, ""), W / 2, oy + qs + 135);
  const l = document.createElement("a"); l.href = c.toDataURL("image/png"); l.download = file.replace(/[^\w ]+/g, "").trim().replace(/\s+/g, "-") + ".png"; l.click();
}

// ---------- Smart Udhaar (Keepsake Pro): who owes the shop, since when; customers confirm and pay by UPI ----------
const khPost = b => post({ id: S.id, ...b });
const khUrl = c => location.origin + "/u/" + c.tok;
const khDays = n => n <= 0 ? "today" : n === 1 ? "1 day" : n + " days";
async function khLoad() { try { S.kh = await khPost({ action: "kh-own-list" }); S.khSum = S.kh.sum; } catch (e) { S.kh = { error: e.message }; } if (S.view === "khata") khRedraw(); }
function khRedraw() { const y = scrollY, sc = $(".pmb") ? $(".pmb").scrollTop : 0; go(); scrollTo(0, y); if ($(".pmb")) $(".pmb").scrollTop = sc; }
const khState = c => c.bal <= 0 ? ["clr", "Cleared"] : c.age > 30 ? ["od", khDays(c.age) + " due"] : c.lim && c.bal > c.lim ? ["od", "Over limit"] : ["due", "Due"];
// Open WhatsApp in a tab first (so phones don't block it), then point it at the message once the server answers.
function khWa(fn) {
  const w = window.open("about:blank", "_blank");
  return fn().then(url => { if (!url) { if (w) w.close(); return; } if (w) w.location.href = url; else location.href = url; }).catch(e => { if (w) w.close(); toast(e.message); });
}
// Start an entry from anywhere (an order, a bill, the khata itself).
function khStart(o) { S.khNew = { kind: "give", phone: "", name: "", amount: "", note: "", src: "", ...o }; S.khOpen = null; S.khQueue = false; if (location.hash !== "#khata") location.hash = "#khata"; else khRedraw(); }

V.khata = () => {
  const K = S.kh, top = r => head("Udhaar khata", "Who owes you, how much and since when. Customers confirm each entry on their phone and pay you by UPI.", r == null ? "" : r);
  if (!K) { khLoad(); return top() + `<div class="empty">Loading your khata…</div>`; }
  if (K.error) return top() + `<div class="empty"><b>Your khata couldn't load.</b>${esc(K.error)}<br><button class="btn" data-kh="reload">Try again</button></div>`;
  const cs = K.customers || [], pro = isPro();
  if (!pro && !cs.length) return top() + `<section class="cd khpitch"><div class="khp1"><span class="pl" style="background:var(--ye)">Keepsake Pro</span><h2 class="H">Stop losing money to udhaar</h2><p class="mu">The notebook can't remind anyone, and customers forget. Smart Udhaar keeps the book on your phone and does the asking for you.</p></div>
    <div class="g2 khf">${[["Customer confirms it", "Every entry goes to the customer on WhatsApp. They tap “Sahi hai”, so there's no argument later."], ["Polite reminders", "One tap sends a reminder that gets firmer each time. You never have to ask face to face."], ["Paid by UPI", "Their khata link has a Pay button with the exact amount. You see who paid and when."], ["Know who's slow", "See what's pending, who is overdue past 30 days, and what came back this month. Set a limit per customer."]].map(x => `<div><b>${x[0]}</b><p class="mu">${x[1]}</p></div>`).join("")}</div>
    <p class="mu" style="margin:16px 0 0">${proPriceLine()}</p>${proBtns()}</section>`;
  const f = S.khf || "due", q = (S.khq || "").toLowerCase().trim(), s = K.sum || {};
  const list = cs.filter(c => f === "all" ? true : f === "due" ? c.bal > 0 : f === "od" ? c.bal > 0 && c.age > 30 : c.bal <= 0)
    .filter(c => !q || (c.name + " " + c.phone).toLowerCase().includes(q))
    .sort((a, b) => f === "clr" ? b.last - a.last : b.bal - a.bal);
  const due = cs.filter(c => c.bal > 0);
  return top(`<div class="tg"><button class="btn" data-kh="new" data-k="give">+ Udhaar</button><button class="btn g" data-kh="new" data-k="pay">Got payment</button></div>`) +
  (!pro ? `<div class="bar" style="margin-bottom:16px"><span><b>Keepsake Pro has ended.</b> Your khata is safe. You can still record payments and send reminders; adding new udhaar needs Pro.</span><button class="btn" data-pro="year">Renew · ${rup(S.proYearPrice)} / year</button></div>` : "") +
  `<div class="g4 khk" style="margin-bottom:16px">
    <div class="kpi k"><span>To collect</span><b>${inr(s.pending)}</b><small>${s.due || 0} customer${s.due === 1 ? "" : "s"}</small></div>
    <div class="kpi y"><span>Came back this month</span><b>${inr(s.recovered)}</b><small>payments recorded</small></div>
    <div class="kpi"><span>Over 30 days</span><b>${s.overdue || 0}</b><small class="mu">${s.overdue ? "remind them today" : "nobody is late"}</small></div>
    <div class="kpi"><span>Say they've paid</span><b>${s.claims || 0}</b><small class="mu">${s.claims ? "check your UPI app" : "nothing to check"}</small></div>
  </div>
  ${due.length ? `<div class="khq"><span><b>${due.length} customer${due.length === 1 ? "" : "s"} owe${due.length === 1 ? "s" : ""} you ${inr(s.pending)}.</b> Send each one a polite WhatsApp reminder with a UPI link.</span><button class="btn w" data-kh="queue">${IC.wa} Remind all</button></div>` : ""}
  <section class="cd">
    <div class="srch"><input class="in" data-kh-s placeholder="Search name or number" value="${esc(S.khq || "")}" aria-label="Search the khata"><div class="tabs" style="margin:0">${[["due", "Due"], ["od", "Over 30 days"], ["clr", "Cleared"], ["all", "All"]].map(([k, l]) => `<button type="button" data-kh="f" data-k="${k}" class="${f === k ? "on" : ""}">${l}</button>`).join("")}</div></div>
    ${list.length ? `<ul class="blr khl">${list.map(c => { const [cl, lb] = khState(c); return `<li><button type="button" data-kh="open" data-p="${c.phone}"><span class="av">${esc(ini(c.name))}</span><span class="nm"><b>${esc(c.name)}</b><small>${c.bal > 0 ? "since " + khDays(c.age) : "last " + ago(c.last)}${c.nr ? " · reminded " + c.nr + "×" : ""}${c.claims ? " · says paid" : ""}</small></span><span class="am"><b>${inr(Math.max(0, c.bal))}</b><span class="pl kh-${cl}">${lb}</span></span></button></li>`; }).join("")}</ul>`
      : `<div class="empty" style="margin-top:14px"><b>${cs.length ? "Nobody here." : "Your khata is empty"}</b>${cs.length ? "Try another filter or search." : "Add the first udhaar. The customer gets it on WhatsApp and confirms it with one tap."}${cs.length ? "" : `<br><button class="btn" data-kh="new" data-k="give">+ Add udhaar</button>`}</div>`}
  </section>

  </div></div>`;
}

function khCustSheet() {

  const c = C.customer, [cl, lb] = khState(c);
  let run = 0; const rows = c.e.slice().reverse().map(x => (run += x.a, { ...x, run })).reverse();
  return `<div class="pm" data-khbg><div class="pmb"><div class="ch"><h2 class="H" style="margin:0">${esc(c.name)}</h2><button class="lnk" data-kh="close">Close</button></div>
    <div class="khbal ${cl}"><div><small>${c.bal > 0 ? "Owes you" : "All clear"}</small><b>${inr(Math.max(0, c.bal))}</b><span>+91 ${esc(c.phone)}${c.bal > 0 ? " · oldest " + khDays(c.age) : ""}</span></div><span class="pl kh-${cl}">${lb}</span></div>
    ${(c.c || []).map(x => `<div class="khw"><b>${esc(c.name)} says they paid ${inr(x.a)}</b><p>${ago(x.t)}. Check your UPI app or cash, then accept it.</p><div class="tg"><button type="button" class="btn s" data-kh="accept" data-c="${x.id}" data-a="${x.a}">It came, record it</button><button type="button" class="btn g s" data-kh="reject" data-c="${x.id}">It didn't come</button></div></div>`).join("")}
    <div class="row2" style="margin-top:14px">${isPro() ? `<button type="button" class="btn" data-kh="new" data-k="give" data-p="${c.phone}">+ Udhaar</button>` : ""}<button type="button" class="btn ${isPro() ? "g" : ""}" data-kh="new" data-k="pay" data-p="${c.phone}">Got payment</button></div>
    ${c.bal > 0 ? `<button type="button" class="btn w" style="width:100%;margin-top:10px" data-kh="remind" data-p="${c.phone}">${IC.wa} ${c.nr ? "Send reminder " + Math.min(3, c.nr + 1) : "Send a reminder"}</button><p class="hint" style="margin:6px 0 0">${c.nr ? "Last reminder " + ago(c.lr) + ". Each one is a little firmer." : "A polite note with their UPI link."}</p>` : ""}
    <div class="khlnk"><span><b>Customer's khata link</b><small>They see their own entries and pay by UPI.</small></span><button type="button" class="btn g s" data-kh="copy" data-u="${esc(C.link)}">Copy</button></div>
    <b style="display:block;margin-top:18px">Entries</b>
    ${rows.length ? `<ul class="khe">${rows.map(x => `<li class="${x.a > 0 ? "gv" : "pd"}"><span><b>${x.a > 0 ? "Udhaar" : "Paid"}${x.note ? " · " + esc(x.note) : ""}</b><small>${new Date(x.t).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "2-digit" })}${x.a > 0 ? (x.ok ? ` · <i class="okc">✓ Customer confirmed</i>` : " · not confirmed yet") : ""}${x.src ? " · " + esc(x.src.replace(":", " ")) : ""}</small></span><span class="am"><b>${x.a > 0 ? "+" : "−"}${inr(Math.abs(x.a))}</b><small>bal ${inr(x.run)}</small></span><button type="button" class="lnk" data-kh="del" data-e="${x.id}" aria-label="Delete entry">${S.khDel === x.id ? "Delete?" : "×"}</button></li>`).join("")}</ul>` : `<p class="mu">No entries.</p>`}
    <div class="khlim"><label class="khlb" style="margin:0;flex:1">Udhaar limit (₹)<input class="in" data-kh-lim inputmode="numeric" placeholder="No limit" value="${c.lim || ""}"></label><button type="button" class="btn g s" data-kh="lim" data-p="${c.phone}">Save</button></div>
    <p class="hint">Above the limit, you're asked before adding more.</p>

}

function khQueueSheet() {
  if (!S.khQueue) return "";
  const due = (S.kh.customers || []).filter(c => c.bal > 0).sort((a, b) => b.age - a.age || b.bal - a.bal);
  return `<div class="pm" data-khbg><div class="pmb"><div class="ch"><h2 class="H" style="margin:0">Remind everyone</h2><button class="lnk" data-kh="close">Close</button></div>
    <p class="mu" style="margin:4px 0 12px">Tap each one. WhatsApp opens with the message ready; send it and come back for the next. Oldest first.</p>
    <ul class="khe">${due.map(c => { const sent = S.khSent && S.khSent[c.phone]; return `<li><div class="khqr"><span class="nm"><b>${esc(c.name)}</b><small>${inr(c.bal)} · ${khDays(c.age)}${c.lr ? " · last reminded " + ago(c.lr) : ""}</small></span>${sent ? `<span class="pl kh-clr">Sent</span>` : `<button type="button" class="btn w s" data-kh="remind" data-p="${c.phone}" data-q="1">${IC.wa} Remind</button>`}</div></li>`; }).join("")}</ul>
  </div></div>`;
}

function khMerge(c) { const L = S.kh.customers, i = L.findIndex(x => x.phone === c.phone); if (i >= 0) L[i] = c; else L.unshift(c); const s = S.kh.sum; s.pending = L.reduce((t, x) => t + Math.max(0, x.bal), 0); s.due = L.filter(x => x.bal > 0).length; s.overdue = L.filter(x => x.bal > 0 && x.age > 30).length; s.claims = L.reduce((t, x) => t + (x.claims || 0), 0); }
async function khOpen(p) { S.khOpen = p; S.khNew = null; S.khQueue = false; S.khDel = null; khRedraw(); try { S.khC = await khPost({ action: "kh-own-get", phone: p }); khMerge(S.khC.customer); } catch (e) { toast(e.message); S.khOpen = null; } khRedraw(); }

$("#main").addEventListener("input", ev => {
  const e = ev.target;
  if (e.matches("[data-kh-s]")) { S.khq = e.value; const at = e.selectionStart; khRedraw(); const n = $("[data-kh-s]"); if (n) { n.focus(); n.setSelectionRange(at, at); } return; }
  if (e.matches("[data-khi]") && S.khNew) {
    const k = e.dataset.khi; S.khNew[k] = k === "amount" ? e.value.replace(/[^\d]/g, "") : e.value; S.khNew.warn = "";
    if (k === "phone") { const at = e.selectionStart; khRedraw(); const n = $('[data-khi="phone"]'); if (n) { n.focus(); n.setSelectionRange(at, at); } }
  }
});
$("#main").addEventListener("click", async ev => {
  if (ev.target.matches("[data-khbg]")) { S.khNew = null; S.khOpen = null; S.khQueue = false; khRedraw(); return; }
  const b = ev.target.closest("[data-kh]"); if (!b) return;
  const a = b.dataset.kh;
  if (a === "reload") { S.kh = null; go(); return; }
  if (a === "f") { S.khf = b.dataset.k; khRedraw(); return; }
  if (a === "close") { S.khNew = null; S.khOpen = null; S.khQueue = false; S.khSent = null; khRedraw(); return; }
  if (a === "new") { khStart({ kind: b.dataset.k, phone: b.dataset.p || "" }); return; }
  if (a === "from") { S.blOpen = null; khStart({ kind: "give", phone: String(b.dataset.p).replace(/\D/g, "").slice(-10), name: b.dataset.n, amount: String(Math.round(+b.dataset.a || 0)), src: b.dataset.src, note: b.dataset.src.startsWith("bill:") ? "Bill " + b.dataset.src.slice(5) : "Order #" + b.dataset.src.slice(6) }); if (!S.kh) khLoad(); return; }
  if (a === "kind") { S.khNew.kind = b.dataset.k; S.khNew.warn = ""; khRedraw(); return; }
  if (a === "pick") { S.khNew.phone = b.dataset.p; khRedraw(); return; }
  if (a === "full") { const c = S.kh.customers.find(x => x.phone === S.khNew.phone.replace(/\D/g, "").slice(-10)); if (c) S.khNew.amount = String(c.bal); khRedraw(); return; }
  if (a === "open") { khOpen(b.dataset.p); return; }
  if (a === "queue") { S.khQueue = true; S.khSent = {}; khRedraw(); return; }
  if (a === "copy") { try { await navigator.clipboard.writeText(b.dataset.u); toast("Link copied."); } catch (x) { prompt("Copy this link:", b.dataset.u); } return; }
  if (a === "save") {
    const N = S.khNew; if (!N || N.busy) return; N.busy = true; b.disabled = true;
    try {
      const j = await khPost({ action: "kh-own-add", kind: N.kind, phone: N.phone, name: N.name, amount: N.amount, note: N.note, src: N.src, claim: N.claim, force: !!b.dataset.force });
      N.busy = false;
      if (j.warn) { N.warn = j.warn; khRedraw(); return; }
      khMerge(j.customer); if (N.kind === "pay") S.kh.sum.recovered += -j.entry.a;
      N.done = j; S.khC = null; khRedraw();
    } catch (x) { N.busy = false; b.disabled = false; toast(x.message); }
    return;
  }
  if (a === "remind") {
    const p = b.dataset.p; b.disabled = true;
    khWa(async () => { const j = await khPost({ action: "kh-own-remind", phone: p }); khMerge(j.customer); if (S.khC && S.khC.customer.phone === p) Object.assign(S.khC.customer, j.customer); if (b.dataset.q) S.khSent[p] = 1; khRedraw(); return j.wa; }).finally(() => { b.disabled = false; });
    return;
  }
  if (a === "accept") { const c = S.khC.customer; khStart({ kind: "pay", phone: c.phone, amount: b.dataset.a, note: "UPI (customer said paid)", claim: b.dataset.c }); return; }
  if (a === "reject") { try { const j = await khPost({ action: "kh-own-reject", phone: S.khOpen, claim: b.dataset.c }); khMerge(j.customer); toast("Removed. You can remind them again."); khOpen(S.khOpen); } catch (x) { toast(x.message); } return; }
  if (a === "lim") { const v = ($("[data-kh-lim]") || {}).value || ""; try { const j = await khPost({ action: "kh-own-limit", phone: b.dataset.p, lim: +v.replace(/\D/g, "") || 0 }); khMerge(j.customer); S.khC.customer.lim = j.customer.lim; toast(j.customer.lim ? "Limit set to " + inr(j.customer.lim) + "." : "Limit removed."); khRedraw(); } catch (x) { toast(x.message); } return; }
  if (a === "del") {
    if (S.khDel !== b.dataset.e) { S.khDel = b.dataset.e; khRedraw(); return; }
    try { const j = await khPost({ action: "kh-own-del", phone: S.khOpen, eid: b.dataset.e }); khMerge(j.customer); toast("Entry deleted."); khOpen(S.khOpen); } catch (x) { toast(x.message); }
  }
});

// ---------- actions ----------
async function setSwitch(k, on) {
  if (k === "open") return patch(d => { d.shut = !on; }, on ? "Your page shows Open again" : "Your page now shows Closed today");
  if (k === "take") return patch(d => { d.pause = !on; }, on ? "Taking orders again" : "Orders paused. Your menu still shows.");
}
function bindCommon() {
  const m = $("#main");
  m.querySelectorAll("[data-sw]").forEach(i => i.onchange = async () => { i.disabled = true; await setSwitch(i.dataset.sw, i.checked); go(); });
  m.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => { const t = $(b.dataset.copy).value; try { await navigator.clipboard.writeText(t); toast("Copied"); } catch (e) { prompt("Copy this:", t); } });
  m.querySelectorAll("[data-copytext]").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copytext); toast("Link copied"); } catch (e) { prompt("Copy this link:", b.dataset.copytext); } });
}

    if (!typing && !S.blNew && !S.khNew && !S.khOpen && ["customers", "messages", "reviews", "offers", "analytics", "settings", "overview", "sales"].includes(S.view)) { const y = scrollY; go(); scrollTo(0, y); }
  } catch (e) { if (!S.d) $("#main").innerHTML = `<div class="load"><div class="empty"><b>Couldn't load your dashboard</b>${esc(e.message)}<br><button class="btn" onclick="location.reload()">Try again</button></div></div>`; else toast("You're offline. Showing your last saved copy."); }
})();
})();
</script>
